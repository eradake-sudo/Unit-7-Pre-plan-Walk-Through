<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Pre-Plan Walkthrough</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #121212; color: #f4f4f4; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .mast { display: flex; align-items: center; gap: 12px; background: #1a1a1a; border-bottom: 5px solid #c8102e; padding: 14px 16px; }
  .mast strong { display: block; letter-spacing: 0.16em; font-size: 1.15rem; }
  .mast img { width: 52px; height: 52px; object-fit: contain; }
  .wrap { max-width: 540px; margin: 0 auto; padding: 16px 16px 48px; }
  h1 { font-size: 1.45rem; margin: 0 0 12px; letter-spacing: 0.08em; text-transform: uppercase; border-left: 4px solid #c8102e; padding-left: 10px; }
  h2 { font-size: 0.95rem; margin: 22px 0 8px; letter-spacing: 0.14em; text-transform: uppercase; color: #f4f4f4; }
  p { color: #b7b7b7; }
  button { width: 100%; background: #f0b429; color: #1a1406; border: 0; border-radius: 4px; padding: 16px; font-size: 1rem; font-weight: 800; margin: 6px 0; letter-spacing: 0.04em; text-transform: uppercase; touch-action: manipulation; }
  button.ghost { background: #1e1e1e; color: #f4f4f4; border: 1px solid #3a3a3a; }
  button.on { outline: 2px solid #f0b429; }
  input, select, textarea { width: 100%; margin: 4px 0 12px; padding: 12px; border-radius: 4px; border: 1px solid #3a3a3a; background: #0e0e0e; color: #f4f4f4; font-size: 1rem; }
  label { color: #b7b7b7; font-size: 0.85rem; letter-spacing: 0.06em; text-transform: uppercase; }
  .card { background: #1c1c1c; border: 1px solid #333; border-left: 4px solid #c8102e; border-radius: 4px; padding: 14px; margin: 12px 0; }
  .nav { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; position: relative; z-index: 5; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
  .chips button { width: auto; flex: 0 0 auto; border-radius: 4px; padding: 8px 14px; text-transform: none; letter-spacing: 0; }
  #map-wrap, .sheet-map { height: 380px; max-height: 380px; width: 100%; border: 2px solid #c8102e; border-radius: 4px; overflow: hidden; background: #1c1c1c; position: relative; z-index: 1; }
  #map, .sheet-map > div { height: 380px; max-height: 380px; width: 100%; }
  #map, .leaflet-container { touch-action: none; }
  .leaflet-container { height: 380px !important; max-height: 380px !important; width: 100% !important; overflow: hidden !important; background: #1c1c1c; font: inherit; }
  .leaflet-container img { max-width: none !important; max-height: none !important; }
  .bar { height: 4px; background: #2a2a2a; border-radius: 0; margin: 0 0 16px; }
  .bar > div { height: 100%; background: #c8102e; width: 0; }
  .warn { border: 1px solid #c8102e; color: #ff6b6b; border-radius: 4px; padding: 12px; background: #2a1212; }
  .flag { color: #ff6b6b; font-weight: 800; margin: 8px 0; letter-spacing: 0.04em; text-transform: uppercase; }
  .thumb { width: 72px; height: 72px; object-fit: cover; border-radius: 4px; margin-top: 8px; display: block; cursor: pointer; }
  .lightbox { position: fixed; inset: 0; z-index: 5000; background: rgba(0,0,0,.92); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
  .lightbox img, .lightbox video { max-width: 100%; max-height: 68vh; object-fit: contain; border-radius: 4px; }
  .lightbox p { color: #f4f4f4; text-align: center; max-width: 420px; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  small { color: #b7b7b7; }
  .plan-view { position: relative; width: 100%; height: 440px; overflow: hidden; touch-action: none; border: 2px solid #c8102e; border-radius: 4px; background: #0e0e0e; margin: 8px 0; }
  .plan-stage { position: absolute; left: 0; top: 0; width: 100%; transform-origin: 0 0; }
  .plan-stage img.plan { width: 100%; display: block; pointer-events: none; user-select: none; }
  .zrow { display: flex; gap: 8px; }
  .zrow button { width: auto; flex: 1; padding: 10px; margin: 0; }
  .plan-pin { position: absolute; transform: translate(-50%, -100%); cursor: pointer; z-index: 2; }
  .sym { display: block; filter: drop-shadow(0 1px 2px rgba(0,0,0,.7)); }
  .hint { background: #1c1c1c; border-left: 4px solid #f0b429; border-radius: 4px; padding: 12px; color: #d0d0d0; font-size: 0.95rem; }
  .hint strong { color: #f4f4f4; }
  .check { display: flex; align-items: center; gap: 10px; color: #f4f4f4; margin: 8px 0; }
  .check input { width: auto; margin: 0; }
  button.loc { text-align: left; text-transform: none; letter-spacing: 0; }
  button.loc small { display: block; color: #1a1406; font-weight: 700; opacity: 0.8; }
  .detail { background: #242424; border-radius: 4px; padding: 10px; margin-top: 8px; }
</style>
</head>
<body>
<header class="mast">
  <img src="unit7-emblem.png" alt="Gillespie Fire Dept">
  <div><strong>PRE-PLAN</strong><small>Walkthrough</small></div>
</header>
<div class="wrap">
  <div class="bar"><div id="bar"></div></div>
  <div id="app"></div>
</div>
<script>
const TYPES = [
  { id: "gas", label: "Gas", short: "GAS", fill: "#e8a317", ink: "#1a1406" },
  { id: "electric", label: "Electric", short: "ELEC", fill: "#f97316", ink: "#1a1406" },
  { id: "hydrant", label: "Hydrant", short: "HYD", fill: "#2563eb", ink: "#fff" },
  { id: "knox", label: "Knox", short: "KNOX", fill: "#f3f5f7", ink: "#1a1406" },
  { id: "exits", label: "Exit", short: "EXIT", fill: "#16a34a", ink: "#fff" },
  { id: "facp", label: "FACP", short: "FACP", fill: "#dc2626", ink: "#fff" },
  { id: "sprinkler", label: "Sprinkler", short: "SPK", fill: "#0ea5e9", ink: "#082f49" },
  { id: "alarm", label: "Alarm", short: "ALM", fill: "#be123c", ink: "#fff" },
  { id: "detector", label: "Detector", short: "DET", fill: "#facc15", ink: "#1a1406" },
  { id: "other", label: "Other", short: "OTH", fill: "#64748b", ink: "#fff" }
];
const CRITICAL = ["gas", "electric", "exits"];
const INT_IDS = ["hydrant", "sprinkler", "alarm", "detector", "facp", "exits", "knox", "other"];
const STEPS = ["start", "building", "exterior", "interior", "plan"];
const KEY = "fd-preplan-pages-v2";
const LIB = "fd-preplan-library-v1";
let step = 0;
let active = "gas";
let intActive = "facp";
let library = { activeId: null, locations: [] };
let readOnly = false;
let migrated = false;
let deptMessage = "";
let updating = false;
let survey = load();
if (migrated) save();
shrinkExisting();
let map, pinLayer, buildingMarker;
let sheetMaps = [];
let openDetail = null;

function blank() {
  return { building: { name: "", address: "", occupancy: "", stories: "", contactName: "", contactPhone: "", hazards: "", hydrants: "", notes: "", center: null }, pins: [], plans: [], absent: {} };
}
function normalize(data) {
  if (!data || !data.building || !Array.isArray(data.pins)) return blank();
  if (!Array.isArray(data.plans)) data.plans = [];
  if (!data.building.contactName && data.building.contact) data.building.contactName = data.building.contact;
  if (!data.building.contactPhone) data.building.contactPhone = "";
  if (!data.absent) data.absent = {};
  return data;
}
function load() {
  try {
    const raw = localStorage.getItem(LIB);
    if (raw) {
      const data = JSON.parse(raw);
      if (data && Array.isArray(data.locations)) {
        library = data;
        library.locations.forEach(loc => { loc.survey = normalize(loc.survey); });
        const cur = library.locations.find(l => l.id === library.activeId) || library.locations[0];
        if (cur) { library.activeId = cur.id; return cur.survey; }
        return blank();
      }
    }
  } catch (e) {}
  try {
    const raw = localStorage.getItem(KEY) || localStorage.getItem("fd-preplan-pages-v1");
    if (raw) {
      const old = normalize(JSON.parse(raw));
      if (old.building.name || old.building.address || old.pins.length || old.plans.length) {
        const id = uid();
        library = { activeId: id, locations: [{ id: id, updated: Date.now(), survey: old }] };
        migrated = true;
        return old;
      }
    }
  } catch (e) {}
  return blank();
}
function publish() {
  const has = (survey.building.name || "").trim() || (survey.building.address || "").trim() || survey.pins.length || survey.plans.length;
  if (!has) return;
  let loc = library.locations.find(l => l.id === library.activeId);
  if (!loc) {
    const id = uid();
    loc = { id: id, updated: Date.now(), survey: survey };
    library.locations.unshift(loc);
    library.activeId = id;
  } else {
    loc.survey = survey;
    loc.updated = Date.now();
  }
}
function save() {
  publish();
  try {
    localStorage.setItem(LIB, JSON.stringify(library));
  } catch (e) {
    try {
      const slim = JSON.parse(JSON.stringify(library));
      (slim.locations || []).forEach(loc => {
        const s = loc.survey || {};
        (s.pins || []).forEach(p => { delete p.media; });
        (s.plans || []).forEach(pl => (pl.pins || []).forEach(p => { delete p.media; }));
      });
      localStorage.setItem(LIB, JSON.stringify(slim));
    } catch (e2) {}
  }
}
function shrinkImage(dataUrl, maxW, quality) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxW / (img.width || maxW));
      const w = Math.max(1, Math.round(img.width * scale));
      const h = Math.max(1, Math.round(img.height * scale));
      const canvas = document.createElement("canvas");
      canvas.width = w;
      canvas.height = h;
      canvas.getContext("2d").drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL("image/jpeg", quality));
    };
    img.onerror = () => resolve(dataUrl);
    img.src = dataUrl;
  });
}
function shrinkExisting() {
  const jobs = [];
  const surveys = (library.locations || []).map(l => l.survey);
  if (surveys.indexOf(survey) === -1) surveys.push(survey);
  surveys.forEach(s => {
    (s.plans || []).forEach(pl => {
      if (pl.image && pl.image.length > 400000) jobs.push(shrinkImage(pl.image, 1600, 0.72).then(url => { pl.image = url; }));
    });
    const pins = (s.pins || []).concat((s.plans || []).flatMap(pl => pl.pins || []));
    pins.forEach(p => {
      if (p.media && p.mediaType !== "video" && p.media.length > 180000) jobs.push(shrinkImage(p.media, 800, 0.62).then(url => { p.media = url; }));
    });
  });
  if (jobs.length) Promise.all(jobs).then(() => save());
}
function typeOf(id) { return TYPES.find(t => t.id === id) || TYPES[TYPES.length - 1]; }
function label(id) { return typeOf(id).label; }
function todayISO() {
  const d = new Date();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return d.getFullYear() + "-" + m + "-" + day;
}
function tourInfo(dateStr) {
  if (!dateStr) return { due: true, text: "No inspection date" };
  const d = new Date(dateStr + "T00:00:00");
  if (isNaN(d.getTime())) return { due: true, text: "No inspection date" };
  const dueOn = new Date(d.getTime());
  dueOn.setFullYear(dueOn.getFullYear() + 5);
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const pretty = d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
  return { due: today >= dueOn, text: "Inspection date " + pretty };
}
function tourFlag(dateStr) {
  const info = tourInfo(dateStr);
  if (!info.due) return `<p><small>${esc(info.text)}</small></p>`;
  return `<div class="flag">${esc(info.text)} · Due for tour</div>`;
}
function esc(s) {
  return String(s || "").replace(/[&<>"']/g, function (c) {
    if (c === "&") return "&" + "amp;";
    if (c === "<") return "&" + "lt;";
    if (c === ">") return "&" + "gt;";
    if (c === '"') return "&" + "quot;";
    return "&" + "#39;";
  });
}

function symbolSvg(id, size) {
  const t = typeOf(id);
  const s = size || 36;
  return `<svg class="sym" width="${s}" height="${s}" viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg">
    <rect x="1" y="1" width="34" height="34" rx="6" fill="${t.fill}" stroke="#fff" stroke-width="2"/>
    <text x="18" y="22" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="700" fill="${t.ink}">${t.short}</text>
  </svg>`;
}
function icon(id) {
  return L.divIcon({ className: "", html: symbolSvg(id, 32), iconSize: [32, 32], iconAnchor: [16, 32], popupAnchor: [0, -28] });
}

function killMaps() {
  if (map) { try { map.remove(); } catch (e) {} map = null; pinLayer = null; buildingMarker = null; }
  sheetMaps.forEach(m => { try { m.remove(); } catch (e) {} });
  sheetMaps = [];
}

function render() {
  killMaps();
  document.getElementById("bar").style.width = (step / (STEPS.length - 1) * 100) + "%";
  const app = document.getElementById("app");
  const s = STEPS[step];
  const b = survey.building;
  if (s === "start") {
    const locs = sortedLocations();
    const dueCount = locs.filter(loc => tourInfo(loc.survey.building.lastInspected).due).length;
    if (updating) {
      app.innerHTML = `<h1>Update</h1>
        ${locs.length ? locs.map(loc => {
          const bld = loc.survey.building;
          const name = bld.name || bld.address || "Unnamed";
          return `<button class="loc" onclick="beginUpdate('${loc.id}')"><strong>${esc(name)}</strong><small>${esc(bld.address || "No address")}</small></button>`;
        }).join("") : `<p><small>No walkthroughs yet.</small></p>`}
        <button class="ghost" onclick="cancelUpdate()">Back</button>`;
      return;
    }
    app.innerHTML = `<button onclick="fresh()">Start new walkthrough</button>
      <button class="ghost" onclick="showUpdateList()">Update walkthrough</button>
      <h2>Locations</h2>
      ${dueCount ? `<div class="warn">${dueCount} ${dueCount === 1 ? "business is" : "businesses are"} due for a 5-year tour.</div>` : ""}
      ${locs.length ? locs.map(loc => {
        const bld = loc.survey.building;
        const name = bld.name || bld.address || "Unnamed";
        return `<div class="card">
          <button class="loc" onclick="openSheet('${loc.id}')"><strong>${esc(name)}</strong><small>${esc(bld.address || "No address")}</small><small>${esc(bld.occupancy || "")}</small></button>
          ${tourFlag(bld.lastInspected)}
          <button class="ghost" onclick="removeLocation('${loc.id}')">Remove</button>
        </div>`;
      }).join("") : `<p><small>No locations yet.</small></p>`}
      ${deptToken() ? "" : `<input id="deptkey" type="password" placeholder="Key" autocomplete="off"><button class="ghost" onclick="saveDeptKey()">Save key on this phone</button>`}
      <p><small id="dept-status">${esc(deptMessage)}</small></p>`;
  } else if (s === "building") {
    app.innerHTML = `<h1>Building</h1>
      <form id="bform" onsubmit="event.preventDefault(); saveBuilding(); return false;">
      <label>Name</label><input id="name" value="${esc(b.name)}">
      <label>Address</label><input id="address" value="${esc(b.address)}">
      <label>Occupancy</label><select id="occ"><option value=""></option><option>Educational (Group E)</option><option>Mercantile</option><option>Business</option><option>Assembly</option><option>Residential</option><option>Industrial</option><option>Other</option></select>
      <label>Stories</label><input id="stories" value="${esc(b.stories || "")}">
      <label>Inspection date</label><input id="inspected" type="date" value="${esc(todayISO())}">
      <label>Contact name</label><input id="contactName" value="${esc(b.contactName || b.contact || "")}">
      <label>Phone</label><input id="contactPhone" type="tel" value="${esc(b.contactPhone || "")}">
      <label>Hazards</label><textarea id="hazards" rows="2">${esc(b.hazards)}</textarea>
      <label>Hydrant notes</label><textarea id="hydrants" rows="2">${esc(b.hydrants)}</textarea>
      <label>Notes</label><textarea id="notes" rows="2">${esc(b.notes)}</textarea>
      <div class="nav"><button class="ghost" type="button" onclick="go(0)">Back</button><button type="submit">Next</button></div>
      </form>`;
    document.getElementById("occ").value = b.occupancy || "";
    const nextBtn = document.querySelector("#bform button[type=submit]");
    if (nextBtn) nextBtn.addEventListener("touchend", function (e) { e.preventDefault(); saveBuilding(); });
  } else if (s === "exterior") {
    app.innerHTML = `<h1>Exterior</h1>
      <div class="nav"><button class="ghost" type="button" onclick="go(1)">Back</button><button type="button" onclick="go(3)">Next</button></div>
      <p>Pick the item, then tap the satellite photo. Write the side of the building so crews do not come in the wrong way.</p>
      <div class="chips" id="chips">${chipHtml(false)}</div>
      <div id="map-wrap"><div id="map"></div></div>
      <p><small id="map-status">Finding the address…</small></p>
      <button type="button" onclick="goToPhone()">My location</button>
      <p><small>Tap the photo to drop a <span id="active-label">${label(active)}</span>.</small></p>
      <div class="nav"><button class="ghost" type="button" onclick="dropCenter()">Drop at center</button><button class="ghost" type="button" onclick="dropGps()">Drop at my GPS</button></div>
      <div id="pins"></div>`;
    showPins();
    setTimeout(bootMap, 30);
  } else if (s === "interior") {
    const intMissing = ["exits"].filter(gap);
    app.innerHTML = `<h1>Interior</h1>
      <div class="hint"><strong>What to look for.</strong> Zoom the diagram, then tap hydrants, sprinklers, alarms, detectors, exits, and the panel if the building has one. Note the room and the wall.</div>
      <div class="card">
        <strong>Not on this site</strong>
        <label class="check"><input type="checkbox" ${isAbsent("knox") ? "checked" : ""} onchange="toggleAbsent('knox', this.checked)"> No Knox box</label>
        <label class="check"><input type="checkbox" ${isAbsent("facp") ? "checked" : ""} onchange="toggleAbsent('facp', this.checked)"> No fire alarm panel</label>
      </div>
      <label>Floor plan name</label><input id="planName" placeholder="1st floor, basement, attic">
      <button class="ghost" onclick="document.getElementById('planFile').click()">Upload paper diagram</button>
      <input id="planFile" type="file" accept="image/*" capture="environment" style="display:none" onchange="addPlan(this)">
      <div class="chips">${INT_IDS.map(id => { const t = typeOf(id); return `<button class="${intActive === id ? "on" : "ghost"}" onclick="setIntType('${id}')">${t.label}</button>`; }).join("")}</div>
      <div id="plans"></div>
      ${intMissing.length ? `<div class="warn">Still needed: ${intMissing.map(label).join(", ")}</div>` : ""}
      <div id="pins"></div>
      <div class="nav"><button class="ghost" onclick="go(2)">Back</button><button onclick="finish()">Quick Action Sheet</button></div>`;
    showPlans();
    showPins();
  } else {
    app.innerHTML = sheetHtml();
    setTimeout(bootSheet, 40);
  }
}

function chipHtml(interior) {
  const list = interior ? TYPES.filter(t => t.id === "facp" || t.id === "exits" || t.id === "other") : TYPES.filter(t => t.id !== "facp");
  const cur = interior ? intActive : active;
  return list.map(t => `<button class="${cur === t.id ? "on" : "ghost"}" onclick="setType('${t.id}')">${symbolSvg(t.id, 18)} ${t.label}</button>`).join("");
}

function sortedLocations() {
  return library.locations.slice().sort((a, b) => {
    const ad = tourInfo(a.survey.building.lastInspected).due ? 0 : 1;
    const bd = tourInfo(b.survey.building.lastInspected).due ? 0 : 1;
    if (ad !== bd) return ad - bd;
    return (a.survey.building.name || "").localeCompare(b.survey.building.name || "");
  });
}
function showUpdateList() { updating = true; render(); }
function cancelUpdate() { updating = false; render(); }
function beginUpdate(id) { updating = false; editLocation(id); }
function fresh() {
  readOnly = false;
  library.activeId = null;
  survey = blank();
  go(1);
}
function openSheet(id) {
  const loc = library.locations.find(l => l.id === id);
  if (!loc) return;
  library.activeId = id;
  survey = loc.survey;
  readOnly = true;
  go(4);
}
function editLocation(id) {
  const loc = library.locations.find(l => l.id === id);
  if (!loc) return;
  library.activeId = id;
  survey = loc.survey;
  readOnly = false;
  go(1);
}
function removeLocation(id) {
  const loc = library.locations.find(l => l.id === id);
  const name = (loc && loc.survey.building.name) || "this location";
  if (!confirm((deptToken() ? "Remove " + name + " from the department list? Every phone will lose it." : "Remove " + name + " from this phone? It will come back from the department list until this phone has the key."))) return;
  deleteRemote(id);
  if (loc && loc.shared) {
    try {
      const ids = JSON.parse(localStorage.getItem("fd-preplan-hidden-shared") || "[]");
      if (ids.indexOf(id) === -1) ids.push(id);
      localStorage.setItem("fd-preplan-hidden-shared", JSON.stringify(ids));
    } catch (e) {}
  }
  if (id === "demo-tour") {
    try { localStorage.setItem("fd-preplan-demo-off", "1"); } catch (e) {}
  }
  library.locations = library.locations.filter(l => l.id !== id);
  if (library.activeId === id) {
    library.activeId = null;
    survey = blank();
  }
  save();
  render();
}
function go(n) {
  const prev = step;
  step = n;
  if (!Array.isArray(survey.plans)) survey.plans = [];
  if (!Array.isArray(survey.pins)) survey.pins = [];
  try { render(); }
  catch (err) {
    const app = document.getElementById("app");
    if (app) app.innerHTML = `<h1>Could not open that step</h1><p>${esc(err && err.message)}</p><div class="nav"><button type="button" onclick="go(2)">Back to map</button></div>`;
  }
  save();
  if ((prev === 1 || prev === 2 || prev === 3) && prev !== n) pushActive();
}
function setType(id) {
  active = id;
  const chips = document.getElementById("chips");
  if (chips) chips.innerHTML = chipHtml(false);
  const lab = document.getElementById("active-label");
  if (lab) lab.textContent = label(id);
  const gps = document.querySelector("button[onclick='dropGps()']");
  if (gps) gps.textContent = "Drop " + label(id) + " at my GPS";

function dropOnPlan(planId, clientX, clientY) {

  const r = view.getBoundingClientRect();

  const y = ((clientY - r.top - v.y) / v.s) / stage.offsetHeight * 100;
  if (x < 0 || y < 0 || x > 100 || y > 100) return;
  const plan = survey.plans.find(p => p.id === planId);

const planViews = {};

  const ix = (cx - v.x) / v.s, iy = (cy - v.y) / v.s;

  v.x = next <= 1.02 ? 0 : cx - ix * next;
  v.y = next <= 1.02 ? 0 : cy - iy * next;

  applyPlanView(id);

function bindPlanGestures(id, editable) {

function bootMap() {

  const q = (survey.building.address || "").trim();

  if (q.length < 4) { if (status) status.textContent = "Address is too short to find."; return; }
  if (status) status.textContent = "Finding " + q + "…";
  const token = ++geocodeToken;
  const arc = "https://geocode.arcgis.com/arcgis/rest/services/World/GeocodeServer/findAddressCandidates?f=json&maxLocations=1&countryCode=USA&location=-89.82,39.13&distance=120000&SingleLine=" + encodeURIComponent(q);

    .catch(() => fetch("https://photon.komoot.io/api/?limit=1&q=" + encodeURIComponent(q))
      .then(r => r.json())

      survey.building.center = { lat: hit.lat, lng: hit.lng, zoom: 18, q: q };
      save();
      map.setView([hit.lat, hit.lng], 18);
      if (status) status.textContent = hit.label;

    const mk = L.marker([p.lat, p.lng], { icon: icon(p.type) }).addTo(m).bindPopup(popupHtml(p));
    group.push(mk);
  });
  if (group.length > 1) m.fitBounds(L.featureGroup(group).getBounds().pad(0.25), { maxZoom: 19 });
  else if (group.length === 1) m.setView(group[0].getLatLng(), 19);
  const fix = () => { try { m.invalidateSize(); } catch (e) {} };
  setTimeout(fix, 80); setTimeout(fix, 400);
}

function sharedHidden(id) {
  try {
    if (id === "demo-tour" && localStorage.getItem("fd-preplan-demo-off")) return true;
    const ids = JSON.parse(localStorage.getItem("fd-preplan-hidden-shared") || "[]");
    return ids.indexOf(id) !== -1;
  } catch (e) { return false; }
}
function hydrateShared(loc) {
  loc.shared = true;
  loc.survey = normalize(loc.survey);
  (loc.survey.plans || []).forEach(pl => {
    if (!pl.image || pl.image === "demo") pl.image = demoPlanImage();
  });
  return loc;
}
const GH_OWNER = "eradake-sudo";
const GH_REPO = "Unit-7-Pre-plan-Walk-Through";
const GH_DIR = "data/locations";
function deptToken() {
  try {
    const old = JSON.parse(localStorage.getItem("ghConfig") || "{}");
    if (old && old.token) return String(old.token).trim();
  } catch (e) {}
  try { return (localStorage.getItem("fd-preplan-token") || "").trim(); } catch (e) { return ""; }
}
function saveDeptKey() {
  const el = document.getElementById("deptkey");
  const v = el ? el.value.trim() : "";
  if (!v) return;
  localStorage.setItem("fd-preplan-token", v);
  deptMessage = "Key saved on this phone.";
  pullDepartment();
}
function ghHeaders() {
  const headers = { Accept: "application/vnd.github+json" };
  const t = deptToken();
  if (t) headers.Authorization = "Bearer " + t;
  return headers;
}
function setDeptStatus(text) {
  deptMessage = text;
  const el = document.getElementById("dept-status");
  if (el) el.textContent = text;
}
function decodeB64(b64) {
  const bin = atob(String(b64 || "").replace(/\n/g, ""));
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function encodeB64(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000) {
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  }
  return btoa(bin);
}
function ghFile(path) {
  return "https://api.github.com/repos/" + GH_OWNER + "/" + GH_REPO + "/contents/" + path;
}
let pulling = false;
function pullDepartment() {
  if (pulling) return Promise.resolve();
  pulling = true;
  const headers = ghHeaders();
  return fetch(ghFile(GH_DIR) + "?ref=main", { headers: headers, cache: "no-store" })
    .then(r => {
      if (r.status === 404) return [];
      if (!r.ok) throw new Error("List " + r.status);
      return r.json();
    })
    .then(files => {
      if (!Array.isArray(files)) return [];
      return Promise.all(files.filter(f => f && /\.json$/i.test(f.name)).map(f =>
        fetch(f.url, { headers: headers, cache: "no-store" })
          .then(r => r.ok ? r.json() : null)
          .then(data => {
            if (!data || !data.content) return;
            const loc = JSON.parse(decodeB64(data.content));
            if (!loc || !loc.id || sharedHidden(loc.id)) return;
            loc._sha = data.sha;
            const ready = hydrateShared(loc);
            const i = library.locations.findIndex(l => l.id === loc.id);
            if (i === -1) library.locations.push(ready);
            else library.locations[i] = ready;
            if (library.activeId === loc.id && (step === 0 || step === 4)) survey = ready.survey;
          })
      ));
    })
    .then(() => {
      save();
      setDeptStatus(deptToken() ? "This phone can publish updates." : "Add the key on this phone to publish updates.");
      if (step === 0 && !(document.activeElement && document.activeElement.id === "deptkey")) render();
    })
    .catch(() => {
      setDeptStatus("Couldn't reach shared sheets. Showing what's on this phone.");
    })
    .then(() => { pulling = false; });
}
function pushLocation(loc) {
  if (!loc || loc.id === "demo-tour") return Promise.resolve();
  if (!deptToken()) {
    setDeptStatus("Saved on this phone only. Add the department key to share it.");
    return Promise.resolve();
  }
  const copy = { id: loc.id, updated: Date.now(), shared: true, survey: JSON.parse(JSON.stringify(loc.survey)) };
  const content = encodeB64(JSON.stringify(copy));
  const path = GH_DIR + "/" + loc.id + ".json";
  const headers = ghHeaders();
  headers["Content-Type"] = "application/json";
  function put(sha) {
    const body = { message: "Update " + ((loc.survey.building && loc.survey.building.name) || loc.id), content: content, branch: "main" };
    if (sha) body.sha = sha;
    return fetch(ghFile(path), { method: "PUT", headers: headers, body: JSON.stringify(body) })
      .then(r => r.json().then(data => ({ ok: r.ok, status: r.status, data: data })));
  }
  const shaReady = loc._sha
    ? Promise.resolve(loc._sha)
    : fetch(ghFile(path) + "?ref=main", { headers: ghHeaders() }).then(r => r.ok ? r.json() : null).then(d => d && d.sha);
  return shaReady.then(sha => put(sha)).then(res => {
    if (res.status === 409) {
      return fetch(ghFile(path) + "?ref=main", { headers: ghHeaders() }).then(r => r.ok ? r.json() : null).then(d => put(d && d.sha));
    }
    return res;
  }).then(res => {
    if (!res.ok) throw new Error((res.data && res.data.message) || ("Save " + res.status));
    loc._sha = res.data.content && res.data.content.sha;
    loc.shared = true;
    loc.updated = copy.updated;
    save();
    setDeptStatus("Shared.");
  }).catch(err => {
    setDeptStatus("Could not share: " + (err && err.message ? err.message : "failed"));
  });
}
function pushActive() {
  const loc = library.locations.find(l => l.id === library.activeId);
  if (!loc) return;
  const b = loc.survey.building || {};
  const has = (b.name || "").trim() || (b.address || "").trim() || (loc.survey.pins || []).length || (loc.survey.plans || []).length;
  if (!has) return;
  pushLocation(loc);
}
function deleteRemote(id) {
  if (!deptToken()) return Promise.resolve();
  const path = GH_DIR + "/" + id + ".json";
  const headers = ghHeaders();
  return fetch(ghFile(path) + "?ref=main", { headers: headers })
    .then(r => r.ok ? r.json() : null)
    .then(data => {
      if (!data || !data.sha) return;
      headers["Content-Type"] = "application/json";
      return fetch(ghFile(path), {
        method: "DELETE",
        headers: headers,
        body: JSON.stringify({ message: "Remove " + id, sha: data.sha, branch: "main" })
      });
    })
    .catch(() => {});
}
function ensureDemo() {
  if (sharedHidden("demo-tour")) return;
  if (library.locations.some(l => l.id === "demo-tour")) return;
  library.locations.unshift({ id: "demo-tour", updated: Date.now(), shared: true, survey: demoSurvey() });
  save();
}
try { ensureDemo(); } catch (e) {}
render();
pullDepartment();
setInterval(function () {
  if (step === 0 && document.visibilityState !== "hidden") pullDepartment();
}, 20000);
