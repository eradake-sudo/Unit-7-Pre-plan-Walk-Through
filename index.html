<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pre-Plan Walkthrough</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f1419;
    color: #e7e9ea;
    line-height: 1.5;
  }
  .container { max-width: 520px; margin: 0 auto; padding: 16px; min-height: 100vh; }
  h1 { font-size: 1.4rem; margin: 0 0 8px; color: #fff; }
  h2 { font-size: 1.15rem; margin: 16px 0 8px; color: #1d9bf0; }
  p { margin: 8px 0; }
  .step { display: none; }
  .step.active { display: block; }
  button, .btn {
    display: inline-block;
    background: #1d9bf0;
    color: #fff;
    border: none;
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
    margin: 6px 0;
  }
  button.secondary { background: #2f3336; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  input, select, textarea {
    width: 100%;
    padding: 12px;
    margin: 6px 0 12px;
    border-radius: 8px;
    border: 1px solid #2f3336;
    background: #1a1d21;
    color: #e7e9ea;
    font-size: 1rem;
  }
  .card {
    background: #1a1d21;
    border-radius: 12px;
    padding: 16px;
    margin: 12px 0;
    border: 1px solid #2f3336;
  }
  .warning {
    background: #3d1f1f;
    border: 1px solid #f4212e;
    color: #f4212e;
    padding: 12px;
    border-radius: 8px;
    margin: 12px 0;
  }
  .success { background: #1a3a1a; border: 1px solid #00ba7c; color: #00ba7c; padding: 12px; border-radius: 8px; margin: 12px 0; }
  #map, #floorplan-view { height: 320px; border-radius: 12px; margin: 12px 0; background: #1a1d21; position: relative; overflow: hidden; }
  #floorplan-view img { max-width: 100%; max-height: 100%; display: block; margin: 0 auto; }
  .progress { height: 6px; background: #2f3336; border-radius: 3px; margin: 12px 0; }
  .progress-bar { height: 100%; background: #1d9bf0; border-radius: 3px; transition: width 0.3s; }
  .pin-list { font-size: 0.9rem; }
  .pin-list div { padding: 8px 0; border-bottom: 1px solid #2f3336; }
  .nav { display: flex; gap: 8px; margin-top: 16px; }
  .nav button { flex: 1; }
  small { color: #71767b; }
  .critical { color: #f4212e; font-weight: 600; }
  .media-preview { max-width: 100%; max-height: 200px; border-radius: 8px; margin: 8px 0; }
  .coords { font-family: monospace; font-size: 0.85rem; color: #71767b; }
</style>
</head>
<body>
<div class="container">
  <div class="progress"><div class="progress-bar" id="progress"></div></div>
  <div id="app"></div>
</div>

<script>
const CRITICAL_ITEMS = [
  { id: 'gas', label: 'Gas shutoff location', tip: 'Usually on the exterior near the gas meter. Look along the side of the building closest to the street or alley. Stand at the meter and take a photo showing the shutoff valve.' },
  { id: 'facp', label: 'Central fire alarm panel (FACP)', tip: 'Often near the main entrance, in an office, or in a mechanical room. Look for a red or gray metal box labeled “Fire Alarm.” Photo the panel and note the room.' },
  { id: 'exits', label: 'All building exits', tip: 'Walk every door that leads outside. Note swing direction, hardware, and if it is locked. Photo each exterior door from outside and inside if possible.' },
  { id: 'electric', label: 'Main electrical disconnect', tip: 'Usually outside near the meter or in a main electrical room. Look for a large gray or black box. Photo the disconnect and label.' },
  { id: 'knox', label: 'Knox box / key box location', tip: 'Typically mounted near the main entrance. Note the side of the building and approximate height. Photo it clearly.' }
];

const STEPS = ['welcome', 'building', 'exterior', 'interior', 'floorplan', 'review'];

let currentStep = 0;
let survey = JSON.parse(localStorage.getItem('preplanSurvey') || '{}');
if (!survey.id) survey = { id: Date.now(), pins: [], completed: {}, building: {}, floorplan: null };

let ghConfig = JSON.parse(localStorage.getItem('ghConfig') || '{}');

function saveGhConfig() {
  localStorage.setItem('ghConfig', JSON.stringify(ghConfig));
}

function setupGitHub() {
  const owner = prompt('GitHub owner (username or org):', ghConfig.owner || '') || '';
  const repo = prompt('Repository name:', ghConfig.repo || '') || '';
  const token = prompt('Personal access token (repo scope):', ghConfig.token || '') || '';
  if (owner && repo && token) {
    ghConfig = { owner: owner.trim(), repo: repo.trim(), token: token.trim(), path: 'preplans' };
    saveGhConfig();
    alert('Shared storage set up. Finished walkthroughs will save automatically.');
    render();
  }
}

function startNew() {
  survey = { id: Date.now(), pins: [], completed: {}, building: {}, floorplan: null };
  save();
  currentStep = 1;
  render();
}

function showSearch() {
  if (!ghConfig.token || !ghConfig.owner || !ghConfig.repo) {
    alert('Set up shared storage first.');
    setupGitHub();
    return;
  }
  currentStep = -1; // special search view
  renderSearch();
}

async function renderSearch() {
  const app = document.getElementById('app');
  app.innerHTML = `
    <h1>Search Pre-Plans</h1>
    <input id="searchq" placeholder="Address or building name" oninput="filterPreplans()">
    <div id="results"></div>
    <button class="secondary" onclick="currentStep=0; render()">Back</button>
  `;
  await loadPreplanList();
}

let preplanFiles = [];

async function loadPreplanList() {
  const results = document.getElementById('results');
  results.innerHTML = '<p>Loading…</p>';
  try {
    const res = await fetch(`https://api.github.com/repos/${ghConfig.owner}/${ghConfig.repo}/contents/${ghConfig.path || 'preplans'}`, {
      headers: { Authorization: `Bearer ${ghConfig.token}`, Accept: 'application/vnd.github+json' }
    });
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();
    preplanFiles = data.filter(f => f.name.endsWith('.json')).map(f => ({
      name: f.name,
      path: f.path,
      sha: f.sha,
      download_url: f.download_url
    }));
    filterPreplans();
  } catch (e) {
    results.innerHTML = `<div class="warning">Could not load list. Check setup or internet.<br><small>${e.message}</small></div>`;
  }
}

function filterPreplans() {
  const q = (document.getElementById('searchq')?.value || '').toLowerCase();
  const results = document.getElementById('results');
  if (!results) return;
  const filtered = preplanFiles.filter(f => f.name.toLowerCase().includes(q) || q === '');
  results.innerHTML = filtered.map(f => `
    <div class="card" style="cursor:pointer" onclick="loadPreplan('${f.path}', '${f.sha}')">
      <strong>${f.name.replace('.json','')}</strong>
    </div>
  `).join('') || '<p>No pre-plans found.</p>';
}

async function loadPreplan(path, sha) {
  try {
    const res = await fetch(`https://api.github.com/repos/${ghConfig.owner}/${ghConfig.repo}/contents/${path}`, {
      headers: { Authorization: `Bearer ${ghConfig.token}`, Accept: 'application/vnd.github+json' }
    });
    if (!res.ok) throw new Error('Failed to load');
    const data = await res.json();
    const content = atob(data.content.replace(/\n/g, ''));
    const loaded = JSON.parse(content);
    survey = loaded;
    survey._sha = data.sha; // for update
    save();
    currentStep = 5; // review
    render();
    alert('Loaded existing pre-plan.');
  } catch (e) {
    alert('Could not load: ' + e.message);
  }
}

function slugify(str) {
  return (str || 'unnamed').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'preplan';
}

async function saveToGitHub() {
  if (!ghConfig.token || !ghConfig.owner || !ghConfig.repo) {
    alert('Shared storage not set up. Export text file instead.');
    exportData();
    return;
  }
  const address = survey.building.address || survey.building.name || 'unknown';
  const filename = slugify(address) + '.json';
  const path = `${ghConfig.path || 'preplans'}/${filename}`;
  const content = btoa(unescape(encodeURIComponent(JSON.stringify(survey, null, 2))));
  const body = {
    message: `Pre-plan update: ${address}`,
    content: content,
    branch: 'main'
  };
  if (survey._sha) body.sha = survey._sha;

  try {
    const res = await fetch(`https://api.github.com/repos/${ghConfig.owner}/${ghConfig.repo}/contents/${path}`, {
      method: 'PUT',
      headers: {
        Authorization: `Bearer ${ghConfig.token}`,
        Accept: 'application/vnd.github+json',
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(body)
    });
    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.message || 'Save failed');
    }
    const result = await res.json();
    survey._sha = result.content.sha;
    save();
    alert('Saved to shared pre-plans.');
  } catch (e) {
    alert('Could not save to shared storage: ' + e.message + '\nExported text file instead.');
    exportData();
  }
}

function save() {
  try {
    localStorage.setItem('preplanSurvey', JSON.stringify(survey));
  } catch (e) {
    alert('Storage full. Large photos/videos may not save. Consider fewer media files.');
  }
}

function updateProgress() {
  const pct = Math.round((currentStep / (STEPS.length - 1)) * 100);
  document.getElementById('progress').style.width = pct + '%';
}

function getCurrentLocation(callback) {
  if (!navigator.geolocation) {
    alert('GPS not available on this device.');
    return;
  }
  navigator.geolocation.getCurrentPosition(
    pos => callback(pos.coords.latitude, pos.coords.longitude),
    err => alert('Could not get location: ' + err.message),
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

function render() {
  const app = document.getElementById('app');
  updateProgress();
  if (currentStep === -1) {
    renderSearch();
    return;
  }
  const step = STEPS[currentStep];

  if (step === 'welcome') {
    const hasGh = ghConfig.token && ghConfig.owner && ghConfig.repo;
    app.innerHTML = `
      <h1>Pre-Plan Walkthrough</h1>
      <p>Open it, follow the steps, and mark the critical items with GPS and photos.</p>
      <div class="card">
        <strong>How it works:</strong>
        <ol style="margin:8px 0; padding-left:20px;">
          <li>Enter the building basics</li>
          <li>Exterior: mark gas, electric, Knox box</li>
          <li>Interior: mark FACP and exits</li>
          <li>Optional floor plan</li>
          <li>Review and finish — saves to the shared pre-plans</li>
        </ol>
      </div>
      <button onclick="startNew()">Start New Walkthrough</button>
      <button class="secondary" onclick="showSearch()">Search Existing Pre-Plans</button>
      ${!hasGh ? '<button class="secondary" onclick="setupGitHub()">Set Up Shared Storage</button>' : '<small>Shared storage ready</small>'}
      ${survey.building.name ? '<button class="secondary" onclick="currentStep=5; render()">Jump to Review</button>' : ''}
    `;
  }

  else if (step === 'building') {
    app.innerHTML = `
      <h1>Building Basics</h1>
      <p>Fill in what you know. You can update later.</p>
      <label>Building / Occupancy Name</label>
      <input id="name" value="${survey.building.name || ''}" placeholder="e.g. Mt Clare School">
      <label>Address</label>
      <input id="address" value="${survey.building.address || ''}" placeholder="Street address">
      <label>Occupancy Type</label>
      <select id="occupancy">
        <option value="Educational (Group E)">Educational (Group E)</option>
        <option value="Mercantile">Mercantile</option>
        <option value="Business">Business</option>
        <option value="Assembly">Assembly</option>
        <option value="Other">Other</option>
      </select>
      <label>Stories</label>
      <input id="stories" type="number" value="${survey.building.stories || 1}" min="1">
      <label>Notes (construction, special concerns)</label>
      <textarea id="notes" rows="3" placeholder="Old Family Dollar converted to school...">${survey.building.notes || ''}</textarea>
      <div class="nav">
        <button class="secondary" onclick="prev()">Back</button>
        <button onclick="saveBuilding()">Next: Exterior Map</button>
      </div>
    `;
    document.getElementById('occupancy').value = survey.building.occupancy || 'Educational (Group E)';
  }

  else if (step === 'exterior') {
    app.innerHTML = `
      <h1>Exterior – Map & GPS</h1>
      <p>The map opens in satellite view centered on the address you entered. Use “My Location” to jump to your GPS, or tap the map to drop pins. Switch layers (top right) between Satellite and Streets if needed.</p>
      <button onclick="centerOnMe()">📍 My Location (GPS)</button>
      <div id="map" style="height:320px; width:100%; background:#1a1d21; border:2px solid #1d9bf0; border-radius:12px; margin:12px 0; display:flex; align-items:center; justify-content:center; color:#71767b;">
        Map loading…
      </div>
      <div class="card">
        <h2>What to look for & mark</h2>
        ${CRITICAL_ITEMS.filter(i => ['gas','electric','knox'].includes(i.id)).map(i => `
          <div style="margin-bottom:12px;">
            <strong class="${survey.completed[i.id] ? '' : 'critical'}">${i.label}</strong><br>
            <small>${i.tip}</small>
          </div>
        `).join('')}
        <button onclick="addPinWithMedia('gas')">Mark Gas Shutoff + Photo/Video</button>
        <button onclick="addPinWithMedia('electric')">Mark Electric Main + Photo/Video</button>
        <button onclick="addPinWithMedia('knox')">Mark Knox Box + Photo/Video</button>
        <button class="secondary" onclick="addPinWithMedia('other')">Mark Other Exterior Item</button>
      </div>
      <div class="pin-list" id="pinlist"></div>
      <div class="nav">
        <button class="secondary" onclick="prev()">Back</button>
        <button onclick="next()">Next: Interior</button>
      </div>
    `;
    initMap();
    renderPins();
  }

  else if (step === 'interior') {
    app.innerHTML = `
      <h1>Interior Walkthrough</h1>
      <p>Go inside. Mark the alarm panel and exits. Use GPS if you can get a fix, or just note the location and attach media.</p>
      <div class="card">
        <h2>What to look for</h2>
        <div style="margin-bottom:12px;">
          <strong class="${survey.completed.facp ? '' : 'critical'}">Central Fire Alarm Panel (FACP)</strong><br>
          <small>${CRITICAL_ITEMS.find(i=>i.id==='facp').tip}</small>
        </div>
        <div style="margin-bottom:12px;">
          <strong class="${survey.completed.exits ? '' : 'critical'}">All Exits</strong><br>
          <small>${CRITICAL_ITEMS.find(i=>i.id==='exits').tip}</small>
        </div>
        <button onclick="addPinWithMedia('facp')">Mark FACP + Photo/Video</button>
        <button onclick="addPinWithMedia('exits')">Mark an Exit + Photo/Video</button>
        <button class="secondary" onclick="addPinWithMedia('window')">Mark Window / Vent Point</button>
        <button class="secondary" onclick="addPinWithMedia('other')">Mark Other Interior Item</button>
      </div>
      <div class="pin-list" id="pinlist"></div>
      <div class="nav">
        <button class="secondary" onclick="prev()">Back</button>
        <button onclick="next()">Next: Floor Plan Diagram</button>
      </div>
    `;
    renderPins();
  }

  else if (step === 'floorplan') {
    app.innerHTML = `
      <h1>Floor Plan / Diagram</h1>
      <p>Upload a photo of the existing floor plan, a sketch, or an overhead shot. Then tap on the image to place pins for rooms, exits, FACP, etc.</p>
      <input type="file" id="floorplan-upload" accept="image/*" onchange="loadFloorplan(this)">
      <div id="floorplan-view"></div>
      <div class="card">
        <button onclick="addFloorPin('facp')">Pin FACP on Diagram</button>
        <button onclick="addFloorPin('exits')">Pin Exit on Diagram</button>
        <button class="secondary" onclick="addFloorPin('other')">Pin Other Item</button>
      </div>
      <div class="pin-list" id="pinlist"></div>
      <div class="nav">
        <button class="secondary" onclick="prev()">Back</button>
        <button onclick="next()">Review & Finish</button>
      </div>
    `;
    renderFloorplan();
    renderPins();
  }

  else if (step === 'review') {
    const missing = CRITICAL_ITEMS.filter(i => !survey.completed[i.id]);
    app.innerHTML = `
      <h1>Review Before You Finish</h1>
      <p>Critical items must be tagged. The app will not let you complete the survey until they are marked.</p>
      ${missing.length ? `<div class="warning"><strong>Missing critical items:</strong><ul>${missing.map(m => `<li>${m.label} — ${m.tip}</li>`).join('')}</ul></div>` : '<div class="success">All critical items marked. Good work.</div>'}
      <div class="card">
        <h2>Building Summary</h2>
        <p><strong>${survey.building.name || 'Unnamed'}</strong><br>
        ${survey.building.address || 'No address'}<br>
        ${survey.building.occupancy || ''} • ${survey.building.stories || 1} story(ies)</p>
        <p>${survey.building.notes || ''}</p>
      </div>
      <div class="card pin-list">
        <h2>Marked Locations (${survey.pins.length})</h2>
        ${survey.pins.map((p, idx) => `
          <div>
            <strong>${p.type.toUpperCase()}</strong>: ${p.note || 'No note'}<br>
            ${p.lat ? `<span class="coords">GPS: ${p.lat.toFixed(6)}, ${p.lng.toFixed(6)}</span><br>` : ''}
            ${p.media ? `<${p.mediaType === 'video' ? 'video' : 'img'} class="media-preview" src="${p.media}" ${p.mediaType === 'video' ? 'controls' : ''}></${p.mediaType === 'video' ? 'video' : 'img'}>` : ''}
          </div>
        `).join('') || '<p>None yet.</p>'}
      </div>
      <button ${missing.length ? 'disabled' : ''} onclick="finish()">Mark Survey Complete</button>
      <button class="secondary" onclick="currentStep=0; render()">Back to Start</button>
      <button class="secondary" onclick="exportData()">Export Notes + Coordinates</button>
    `;
  }
}

function next() { if (currentStep < STEPS.length - 1) { currentStep++; render(); } }
function prev() { if (currentStep > 0) { currentStep--; render(); } }

function saveBuilding() {
  survey.building.name = document.getElementById('name').value;
  survey.building.address = document.getElementById('address').value;
  survey.building.occupancy = document.getElementById('occupancy').value;
  survey.building.stories = document.getElementById('stories').value;
  survey.building.notes = document.getElementById('notes').value;
  save();
  next();
}

function addPinWithMedia(type) {
  const note = prompt(`Note for ${type} (side of building, room, description):`) || '';
  const pin = { type, note, time: new Date().toISOString() };

  getCurrentLocation((lat, lng) => {
    pin.lat = lat;
    pin.lng = lng;
  });

  // Media capture
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*,video/*';
  input.capture = 'environment';
  input.onchange = e => {
    const file = e.target.files[0];
    if (!file) { finishPin(pin); return; }
    const reader = new FileReader();
    reader.onload = () => {
      pin.media = reader.result;
      pin.mediaType = file.type.startsWith('video') ? 'video' : 'image';
      finishPin(pin);
    };
    reader.readAsDataURL(file);
  };
  input.click();

  // Fallback if user cancels media
  setTimeout(() => {
    if (!pin.media && !survey.pins.includes(pin)) {
      // still allow pin without media after a moment if needed, but better wait
    }
  }, 500);

  function finishPin(p) {
    survey.pins.push(p);
    survey.completed[type] = true;
    save();
    if (window.map && p.lat) {
      L.marker([p.lat, p.lng]).addTo(window.map).bindPopup(`${type}: ${note}`);
    }
    renderPins();
    if (STEPS[currentStep] === 'review') render();
  }
}

function renderPins() {
  const list = document.getElementById('pinlist');
  if (!list) return;
  const relevant = survey.pins.filter(p => {
    if (STEPS[currentStep] === 'exterior') return ['gas','electric','knox','other'].includes(p.type);
    if (STEPS[currentStep] === 'interior') return ['facp','exits','window','other'].includes(p.type);
    if (STEPS[currentStep] === 'floorplan') return p.floorplan;
    return true;
  });
  list.innerHTML = relevant.map(p => `
    <div>
      ${p.type.toUpperCase()}: ${p.note || '—'}
      ${p.lat ? `<br><span class="coords">${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}</span>` : ''}
      ${p.media ? ' 📷/🎥' : ''}
    </div>
  `).join('') || '<small>No pins yet on this step.</small>';
}

function initMap() {
  setTimeout(() => {
    const mapEl = document.getElementById('map');
    if (!mapEl) {
      console.error('Map element not found');
      return;
    }

    // Force visible container
    mapEl.style.height = '320px';
    mapEl.style.width = '100%';
    mapEl.style.display = 'block';
    mapEl.style.background = '#1a1d21';
    mapEl.style.border = '1px solid #2f3336';

    if (typeof L === 'undefined') {
      mapEl.innerHTML = '<div style="padding:20px; text-align:center; color:#f4212e;">Map library failed to load.<br><small>Check internet connection and refresh.</small></div>';
      return;
    }

    mapEl.innerHTML = '';
    if (window.map) {
      try { window.map.remove(); } catch (e) {}
    }

    const map = L.map(mapEl, { zoomControl: true }).setView([39.13, -89.82], 16);

    const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles &copy; Esri',
      maxZoom: 19
    });

    const streets = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap',
      maxZoom: 19
    });

    satellite.addTo(map);
    L.control.layers({ 'Satellite': satellite, 'Streets': streets }).addTo(map);
    window.map = map;

    // Geocode if address exists
    const address = (survey.building.address || '') + (survey.building.name ? ' ' + survey.building.name : '');
    if (address.trim()) {
      fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}&limit=1`)
        .then(r => r.json())
        .then(data => {
          if (data && data[0]) {
            const lat = parseFloat(data[0].lat);
            const lon = parseFloat(data[0].lon);
            map.setView([lat, lon], 18);
            L.marker([lat, lon]).addTo(map).bindPopup('Building').openPopup();
          }
        })
        .catch(() => {});
    }

    map.on('click', e => {
      const type = prompt('Pin type (gas, electric, knox, facp, exit, other):', 'other') || 'other';
      const note = prompt('Short note:') || '';
      const pin = { type: type.toLowerCase(), note, lat: e.latlng.lat, lng: e.latlng.lng, time: new Date().toISOString() };
      survey.pins.push(pin);
      survey.completed[type.toLowerCase()] = true;
      save();
      L.marker(e.latlng).addTo(map).bindPopup(`${type}: ${note}`);
      renderPins();
    });

    survey.pins.filter(p => p.lat && !p.floorplan).forEach(p => {
      L.marker([p.lat, p.lng]).addTo(map).bindPopup(`${p.type}: ${p.note || ''}`);
    });

    // Force redraw multiple times for mobile
    setTimeout(() => { map.invalidateSize(); }, 100);
    setTimeout(() => { map.invalidateSize(); }, 500);
    setTimeout(() => { map.invalidateSize(); }, 1000);
  }, 200);
}

function centerOnMe() {
  getCurrentLocation((lat, lng) => {
    if (window.map) {
      window.map.setView([lat, lng], 18);
      L.circleMarker([lat, lng], { radius: 8, color: '#1d9bf0', fillOpacity: 0.8 }).addTo(window.map).bindPopup('You are here').openPopup();
      setTimeout(() => window.map.invalidateSize(), 100);
    } else {
      alert('Map not ready. Scroll up — the map box should be under the My Location button.');
    }
  });
}

function loadFloorplan(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    survey.floorplan = reader.result;
    save();
    renderFloorplan();
  };
  reader.readAsDataURL(file);
}

function renderFloorplan() {
  const view = document.getElementById('floorplan-view');
  if (!view) return;
  if (survey.floorplan) {
    view.innerHTML = `<img src="${survey.floorplan}" id="fp-img">`;
    const img = document.getElementById('fp-img');
    img.onclick = e => {
      const rect = img.getBoundingClientRect();
      const x = ((e.clientX - rect.left) / rect.width * 100).toFixed(1);
      const y = ((e.clientY - rect.top) / rect.height * 100).toFixed(1);
      const type = prompt('Pin type on diagram:', 'other') || 'other';
      const note = prompt('Note:') || '';
      survey.pins.push({ type, note, floorplan: true, x, y, time: new Date().toISOString() });
      survey.completed[type] = true;
      save();
      renderPins();
    };
  } else {
    view.innerHTML = '<p style="padding:20px; text-align:center;">Upload a floor plan image above to pin on it.</p>';
  }
}

function addFloorPin(type) {
  if (!survey.floorplan) { alert('Upload a floor plan image first.'); return; }
  alert('Tap on the diagram image to place the pin.');
}

function finish() {
  survey.completed.survey = true;
  save();
  saveToGitHub();
  render();
}

function exportData() {
  const text = `PRE-PLAN: ${survey.building.name || 'Unnamed'}
Address: ${survey.building.address || ''}
Occupancy: ${survey.building.occupancy || ''}
Stories: ${survey.building.stories || ''}
Notes: ${survey.building.notes || ''}

LOCATIONS:
${survey.pins.map(p => `- ${p.type.toUpperCase()}: ${p.note || 'no note'} ${p.lat ? `(GPS ${p.lat.toFixed(6)}, ${p.lng.toFixed(6)})` : ''} ${p.media ? '[media attached]' : ''} ${p.floorplan ? `(diagram ${p.x}%, ${p.y}%)` : ''}`).join('\n')}

Critical items marked: ${CRITICAL_ITEMS.filter(i => survey.completed[i.id]).map(i => i.label).join(', ') || 'none'}
`;
  const blob = new Blob([text], {type: 'text/plain'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `preplan-${(survey.building.name || 'building').replace(/\s+/g, '-')}.txt`;
  a.click();
}

render();
</script>
</body>
</html>
