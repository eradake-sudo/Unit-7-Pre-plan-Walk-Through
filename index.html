<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Pre-Plan Walkthrough</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #0e1114; color: #f3f5f7; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .wrap { max-width: 540px; margin: 0 auto; padding: 16px 16px 48px; }
  h1 { font-size: 1.55rem; margin: 0 0 6px; letter-spacing: 0.02em; text-transform: uppercase; }
  h2 { font-size: 1.05rem; margin: 18px 0 8px; }
  p { color: #9aa3ad; }
  button { width: 100%; background: #e8a317; color: #1a1406; border: 0; border-radius: 12px; padding: 14px; font-size: 1rem; font-weight: 700; margin: 6px 0; }
  button.ghost { background: #212830; color: #f3f5f7; }
  button.on { outline: 2px solid #f3f5f7; }
  input, select, textarea { width: 100%; margin: 4px 0 12px; padding: 12px; border-radius: 12px; border: 1px solid #2c353e; background: #0e1114; color: #f3f5f7; font-size: 1rem; }
  label { color: #9aa3ad; font-size: 0.9rem; }
  .card { background: #171c21; border: 1px solid #2c353e; border-radius: 14px; padding: 14px; margin: 12px 0; }
  .nav { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
  .chips button { width: auto; flex: 0 0 auto; border-radius: 999px; padding: 8px 14px; }
  #map-wrap, .sheet-map { height: 380px; max-height: 380px; width: 100%; border: 2px solid #e8a317; border-radius: 14px; overflow: hidden; background: #171c21; position: relative; z-index: 1; }
  #map, .sheet-map > div { height: 380px; max-height: 380px; width: 100%; }
  .leaflet-container { height: 380px !important; max-height: 380px !important; width: 100% !important; overflow: hidden !important; background: #171c21; font: inherit; }
  .nav { position: relative; z-index: 5; }
  .leaflet-container img { max-width: none !important; max-height: none !important; }
  .bar { height: 4px; background: #212830; border-radius: 4px; margin: 10px 0 16px; }
  .bar > div { height: 100%; background: #e8a317; width: 0; }
  .warn { border: 1px solid #e23b3b; color: #e23b3b; border-radius: 12px; padding: 12px; }
  .shot { width: 100%; border-radius: 10px; margin-top: 8px; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  small { color: #9aa3ad; }
  .plan-view { position: relative; width: 100%; height: 440px; overflow: hidden; touch-action: none; border: 2px solid #e8a317; border-radius: 14px; background: #0e1114; margin: 8px 0; }
  .plan-stage { position: absolute; left: 0; top: 0; width: 100%; transform-origin: 0 0; }
  .plan-stage img.plan { width: 100%; display: block; pointer-events: none; user-select: none; }
  .zrow { display: flex; gap: 8px; }
  .zrow button { width: auto; flex: 1; padding: 10px; margin: 0; }
  .plan-pin { position: absolute; transform: translate(-50%, -100%); cursor: pointer; z-index: 2; }
  .sym { display: block; filter: drop-shadow(0 1px 2px rgba(0,0,0,.7)); }
  .hint { background: #212830; border-radius: 12px; padding: 12px; color: #c5cdd5; font-size: 0.95rem; }
  .hint strong { color: #f3f5f7; }
  .detail { background: #212830; border-radius: 10px; padding: 10px; margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar"><div id="bar"></div></div>
  <div id="app"></div>
</div>
<script>
const TYPES = [
  { id: "gas", label: "Gas", short: "GAS", fill: "#e8a317", ink: "#1a1406" },
  { id: "electric", label: "Electric", short: "ELEC", fill: "#f97316", ink: "#1a1406" },
  { id: "hydrant", label: "Hydrant", short: "HYD", fill: "#2563eb", ink: "#fff" },
  { id: "knox", label: "Knox", short: "KNOX", fill: "#f3f5f7", ink: "#1a1406" },
  { id: "exits", label: "Exit", short: "EXIT", fill: "#16a34a", ink: "#fff" },
  { id: "facp", label: "FACP", short: "FACP", fill: "#dc2626", ink: "#fff" },
  { id: "other", label: "Other", short: "OTH", fill: "#64748b", ink: "#fff" }
];
const CRITICAL = ["gas", "electric", "knox", "exits", "facp"];
const STEPS = ["start", "building", "exterior", "interior", "plan"];
const KEY = "fd-preplan-pages-v2";
let step = 0;
let active = "gas";
let intActive = "facp";
let survey = load();
let map, pinLayer, buildingMarker;
let sheetMaps = [];
let openDetail = null;

function blank() {
  return { building: { name: "", address: "", occupancy: "Educational (Group E)", stories: "1", contactName: "", contactPhone: "", hazards: "", hydrants: "", notes: "", center: null }, pins: [], plans: [] };
}
function load() {
  try {
    const raw = localStorage.getItem(KEY) || localStorage.getItem("fd-preplan-pages-v1");
    if (!raw) return blank();
    const data = JSON.parse(raw);
    if (!data.building || !Array.isArray(data.pins)) return blank();
    if (!Array.isArray(data.plans)) data.plans = [];
    if (!data.building.contactName && data.building.contact) data.building.contactName = data.building.contact;
    if (!data.building.contactPhone) data.building.contactPhone = "";
    return data;
  } catch (e) { return blank(); }
}
function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify(survey));
  } catch (e) {
    try {
      const slim = JSON.parse(JSON.stringify(survey));
      (slim.pins || []).forEach(p => { delete p.media; });
      (slim.plans || []).forEach(pl => { delete pl.image; (pl.pins || []).forEach(p => { delete p.media; }); });
      localStorage.setItem(KEY, JSON.stringify(slim));
    } catch (e2) {}
  }
}
function typeOf(id) { return TYPES.find(t => t.id === id) || TYPES[TYPES.length - 1]; }
function label(id) { return typeOf(id).label; }
function uid() { return Math.random().toString(36).slice(2, 10); }
function esc(s) {
  return String(s || "").replace(/[&<>"']/g, function (c) {
    if (c === "&") return "&" + "amp;";
    if (c === "<") return "&" + "lt;";
    if (c === ">") return "&" + "gt;";
    if (c === '"') return "&" + "quot;";
    return "&" + "#39;";
  });
}

function symbolSvg(id, size) {
  const t = typeOf(id);
  const s = size || 36;
  return `<svg class="sym" width="${s}" height="${s}" viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg">
    <rect x="1" y="1" width="34" height="34" rx="6" fill="${t.fill}" stroke="#fff" stroke-width="2"/>
    <text x="18" y="22" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="700" fill="${t.ink}">${t.short}</text>
  </svg>`;
}
function icon(id) {
  return L.divIcon({ className: "", html: symbolSvg(id, 32), iconSize: [32, 32], iconAnchor: [16, 32], popupAnchor: [0, -28] });
}

function killMaps() {
  if (map) { try { map.remove(); } catch (e) {} map = null; pinLayer = null; buildingMarker = null; }
  sheetMaps.forEach(m => { try { m.remove(); } catch (e) {} });
  sheetMaps = [];
}

function render() {
  killMaps();
  document.getElementById("bar").style.width = (step / (STEPS.length - 1) * 100) + "%";
  const app = document.getElementById("app");
  const s = STEPS[step];
  const b = survey.building;
  if (s === "start") {
    app.innerHTML = `<h1>Pre-Plan</h1><p>Satellite overhead for the exterior. Upload the paper diagram and pin the interior. Finish with a Quick Action Sheet.</p>
      <button onclick="fresh()">Start new walkthrough</button>
      ${b.name ? `<button class="ghost" onclick="go(2)">Continue ${esc(b.name)}</button>` : ""}`;
  } else if (s === "building") {
    app.innerHTML = `<h1>Building</h1>
      <label>Name</label><input id="name" value="${esc(b.name)}" placeholder="Mt Clare School">
      <label>Address</label><input id="address" value="${esc(b.address)}" placeholder="1022 N High St, Carlinville IL">
      <label>Occupancy</label><select id="occ"><option>Educational (Group E)</option><option>Mercantile</option><option>Business</option><option>Assembly</option><option>Residential</option><option>Industrial</option><option>Other</option></select>
      <label>Stories</label><input id="stories" value="${esc(b.stories || "1")}">
      <label>Contact name</label><input id="contactName" value="${esc(b.contactName || b.contact || "")}" placeholder="Owner or manager">
      <label>Phone</label><input id="contactPhone" type="tel" value="${esc(b.contactPhone || "")}" placeholder="(217) 555-0100">
      <label>Hazards</label><textarea id="hazards" rows="2">${esc(b.hazards)}</textarea>
      <label>Hydrant notes</label><textarea id="hydrants" rows="2">${esc(b.hydrants)}</textarea>
      <label>Notes</label><textarea id="notes" rows="2">${esc(b.notes)}</textarea>
      <div class="nav"><button class="ghost" onclick="go(0)">Back</button><button onclick="saveBuilding()">Exterior map</button></div>`;
    document.getElementById("occ").value = b.occupancy || "Educational (Group E)";
  } else if (s === "exterior") {
    app.innerHTML = `<h1>Exterior</h1>
      <div class="nav"><button class="ghost" onclick="go(1)">Back</button><button type="button" onclick="go(3)">Interior</button></div>
      <p>Pick the item, then tap the satellite photo. Write the side of the building so crews do not come in the wrong way.</p>
      <div class="chips" id="chips">${chipHtml(false)}</div>
      <div id="map-wrap"><div id="map"></div></div>
      <p><small>Tap the photo to drop a <span id="active-label">${label(active)}</span>.</small></p>
      <button class="ghost" type="button" onclick="dropGps()">Drop ${label(active)} at my GPS</button>
      <div id="pins"></div>`;
    showPins();
    setTimeout(bootMap, 30);
  } else if (s === "interior") {
    const missing = CRITICAL.filter(id => !survey.pins.some(p => p.type === id) && id !== "facp" && id !== "exits");
    const intMissing = ["facp", "exits"].filter(id => !survey.plans.some(pl => pl.pins.some(p => p.type === id)) && !survey.pins.some(p => p.type === id));
    app.innerHTML = `<h1>Interior</h1>
      <div class="hint"><strong>What to look for.</strong> Photograph the paper floor plan, then tap the diagram to mark the FACP, exits, and anything that changes how you enter or search. Note the room and the wall.</div>
      <label>Floor plan name</label><input id="planName" placeholder="1st floor, basement, attic">
      <button class="ghost" onclick="document.getElementById('planFile').click()">Upload paper diagram</button>
      <input id="planFile" type="file" accept="image/*" capture="environment" style="display:none" onchange="addPlan(this)">
      <div class="chips">${TYPES.filter(t => t.id === "facp" || t.id === "exits" || t.id === "other" || t.id === "knox").map(t => `<button class="${intActive === t.id ? "on" : "ghost"}" onclick="setIntType('${t.id}')">${t.label}</button>`).join("")}</div>
      <div id="plans"></div>
      ${intMissing.length ? `<div class="warn">Still needed: ${intMissing.map(label).join(", ")}</div>` : ""}
      <div id="pins"></div>
      <div class="nav"><button class="ghost" onclick="go(2)">Back</button><button onclick="finish()">Quick Action Sheet</button></div>`;
    showPlans();
    showPins();
  } else {
    app.innerHTML = sheetHtml();
    setTimeout(bootSheet, 40);
  }
}

function chipHtml(interior) {
  const list = interior ? TYPES.filter(t => t.id === "facp" || t.id === "exits" || t.id === "other") : TYPES.filter(t => t.id !== "facp");
  const cur = interior ? intActive : active;
  return list.map(t => `<button class="${cur === t.id ? "on" : "ghost"}" onclick="setType('${t.id}')">${symbolSvg(t.id, 18)} ${t.label}</button>`).join("");
}

function fresh() { survey = blank(); save(); go(1); }
function go(n) {
  step = n;
  if (!Array.isArray(survey.plans)) survey.plans = [];
  if (!Array.isArray(survey.pins)) survey.pins = [];
  try { render(); }
  catch (err) {
    const app = document.getElementById("app");
    if (app) app.innerHTML = `<h1>Could not open that step</h1><p>${esc(err && err.message)}</p><div class="nav"><button type="button" onclick="go(2)">Back to map</button></div>`;
  }
  save();
}
function setType(id) {
  active = id;
  const chips = document.getElementById("chips");
  if (chips) chips.innerHTML = chipHtml(false);
  const lab = document.getElementById("active-label");
  if (lab) lab.textContent = label(id);
  const gps = document.querySelector("button[onclick='dropGps()']");
  if (gps) gps.textContent = "Drop " + label(id) + " at my GPS";
}
function setIntType(id) { intActive = id; render(); }
function saveBuilding() {
  const b = survey.building;
  const prev = b.address;
  b.name = document.getElementById("name").value;
  b.address = document.getElementById("address").value;
  if (prev !== b.address) b.center = null;
  b.occupancy = document.getElementById("occ").value;
  b.stories = document.getElementById("stories").value;
  b.contactName = document.getElementById("contactName").value;
  b.contactPhone = document.getElementById("contactPhone").value;
  b.hazards = document.getElementById("hazards").value;
  b.hydrants = document.getElementById("hydrants").value;
  b.notes = document.getElementById("notes").value;
  save(); go(2);
}
function finish() {
  const missing = CRITICAL.filter(id => {
    const onMap = survey.pins.some(p => p.type === id);
    const onPlan = survey.plans.some(pl => pl.pins.some(p => p.type === id));
    return !onMap && !onPlan;
  });
  if (missing.length && !confirm("Missing: " + missing.map(label).join(", ") + ". Open the sheet anyway?")) return;
  go(4);
}

function addPin(lat, lng, type) {
  survey.pins.push({ id: uid(), type: type || active, note: "", lat, lng });
  save();
  if (STEPS[step] === "exterior" && map) drawPins();
  showPins();
}
function patch(id, note, planId) {
  const pin = findPin(id, planId);
  if (pin) pin.note = note;
  save();
}
function removePin(id, planId) {
  if (planId) {
    const plan = survey.plans.find(p => p.id === planId);
    if (plan) plan.pins = plan.pins.filter(p => p.id !== id);
  } else {
    survey.pins = survey.pins.filter(p => p.id !== id);
  }
  save();
  if (map) drawPins();
  showPins();
  showPlans();
}
function findPin(id, planId) {
  if (planId) {
    const plan = survey.plans.find(p => p.id === planId);
    return plan && plan.pins.find(p => p.id === id);
  }
  return survey.pins.find(p => p.id === id);
}
function photo(id, input, planId) {
  const file = input.files && input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const pin = findPin(id, planId);
    if (!pin) return;
    pin.media = reader.result;
    pin.mediaType = file.type.indexOf("video") === 0 ? "video" : "image";
    save();
    showPins();
    showPlans();
  };
  reader.readAsDataURL(file);
}
function dropGps(type) {
  if (!navigator.geolocation) { alert("GPS is not available on this device."); return; }
  navigator.geolocation.getCurrentPosition(
    pos => addPin(pos.coords.latitude, pos.coords.longitude, type || active),
    () => alert("Location was denied. You can still tap the satellite photo."),
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

function showPins() {
  const el = document.getElementById("pins");
  if (!el) return;
  const list = STEPS[step] === "interior" ? [] : survey.pins;
  el.innerHTML = list.length ? list.map(p => pinCard(p)).join("") : (STEPS[step] === "exterior" ? `<p><small>No markers yet.</small></p>` : "");
}
function pinCard(p, planId) {
  return `<div class="card">
    <div class="row"><strong>${symbolSvg(p.type, 22)} ${label(p.type)}</strong>
    <button class="ghost" style="width:auto;padding:8px 12px" onclick="removePin('${p.id}'${planId ? ",'" + planId + "'" : ""})">Remove</button></div>
    ${p.lat != null ? `<small>${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}</small>` : ""}
    ${p.x != null ? `<small>${Math.round(p.x)}% across, ${Math.round(p.y)}% down</small>` : ""}
    <input value="${esc(p.note)}" placeholder="Side of building, room, wall, access" oninput="patch('${p.id}', this.value${planId ? ",'" + planId + "'" : ""})">
    <label class="ghost" style="display:block;text-align:center;background:#212830;border-radius:10px;padding:10px;font-weight:700">Add photo
      <input type="file" accept="image/*,video/*" capture="environment" style="display:none" onchange="photo('${p.id}', this${planId ? ",'" + planId + "'" : ""})">
    </label>
    ${p.media && p.mediaType !== "video" ? `<img class="shot" src="${p.media}" alt="">` : ""}
    ${p.media && p.mediaType === "video" ? `<video class="shot" src="${p.media}" controls></video>` : ""}
  </div>`;
}

function addPlan(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  const name = (document.getElementById("planName").value || "").trim() || "Floor plan";
  const reader = new FileReader();
  reader.onload = () => {
    survey.plans.push({ id: uid(), name, image: reader.result, pins: [] });
    save();
    showPlans();
  };
  reader.readAsDataURL(file);
}
function dropOnPlan(planId, clientX, clientY) {
  const view = document.getElementById("view-" + planId);
  const stage = document.getElementById("stage-" + planId);
  if (!view || !stage) return;
  const v = viewOf(planId);
  const r = view.getBoundingClientRect();
  const x = ((clientX - r.left - v.x) / v.s) / stage.offsetWidth * 100;
  const y = ((clientY - r.top - v.y) / v.s) / stage.offsetHeight * 100;
  if (x < 0 || y < 0 || x > 100 || y > 100) return;
  const plan = survey.plans.find(p => p.id === planId);
  if (!plan) return;
  plan.pins.push({ id: uid(), type: intActive, note: "", x, y });
  save();
  showPlans();
}
const planViews = {};
function viewOf(id) {
  if (!planViews[id]) planViews[id] = { s: 1, x: 0, y: 0 };
  return planViews[id];
}
function applyPlanView(id) {
  const st = document.getElementById("stage-" + id);
  if (!st) return;
  const v = viewOf(id);
  st.style.transform = "translate(" + v.x + "px," + v.y + "px) scale(" + v.s + ")";
}
function zoomPlan(id, dir) {
  const view = document.getElementById("view-" + id);
  const v = viewOf(id);
  const next = Math.min(6, Math.max(1, +(v.s * (dir > 0 ? 1.35 : 1 / 1.35)).toFixed(3)));
  if (!view) { v.s = next; return; }
  const r = view.getBoundingClientRect();
  const cx = r.width / 2, cy = r.height / 2;
  const ix = (cx - v.x) / v.s, iy = (cy - v.y) / v.s;
  v.s = next;
  v.x = next <= 1.02 ? 0 : cx - ix * next;
  v.y = next <= 1.02 ? 0 : cy - iy * next;
  if (v.s <= 1.02) v.s = 1;
  applyPlanView(id);
}
function resetPlan(id) {
  planViews[id] = { s: 1, x: 0, y: 0 };
  applyPlanView(id);
}
function planFrame(pl) {
  return `<div class="zrow">
      <button class="ghost" type="button" onclick="zoomPlan('${pl.id}', -1)">−</button>
      <button class="ghost" type="button" onclick="zoomPlan('${pl.id}', 1)">+</button>
      <button class="ghost" type="button" onclick="resetPlan('${pl.id}')">Fit</button>
    </div>
    <div class="plan-view" id="view-${pl.id}">
      <div class="plan-stage" id="stage-${pl.id}">${planPins(pl)}<img class="plan" src="${pl.image}" alt="" draggable="false"></div>
    </div>`;
}
function bindPlanGestures(id, editable) {
  const view = document.getElementById("view-" + id);
  if (!view || view.dataset.bound) return;
  view.dataset.bound = "1";
  applyPlanView(id);
  const pointers = new Map();
  let start = null, moved = false, pinch0 = 0, base = null;
  function pts() { return Array.from(pointers.values()); }
  view.addEventListener("pointerdown", function (e) {
    if (e.target.closest && e.target.closest(".plan-pin")) return;
    view.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    moved = false;
    const v = viewOf(id);
    if (pointers.size === 1) start = { x: e.clientX, y: e.clientY, vx: v.x, vy: v.y };
    if (pointers.size === 2) {
      const a = pts()[0], b = pts()[1];
      pinch0 = Math.hypot(a.x - b.x, a.y - b.y) || 1;
      base = { s: v.s, x: v.x, y: v.y };
    }
  });
  view.addEventListener("pointermove", function (e) {
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const v = viewOf(id);
    if (pointers.size === 1 && start && v.s > 1) {
      const dx = e.clientX - start.x, dy = e.clientY - start.y;
      if (Math.hypot(dx, dy) > 8) moved = true;
      if (moved) { v.x = start.vx + dx; v.y = start.vy + dy; applyPlanView(id); }
    } else if (pointers.size === 2 && base) {
      const a = pts()[0], b = pts()[1];
      const d = Math.hypot(a.x - b.x, a.y - b.y) || 1;
      const r = view.getBoundingClientRect();
      const cx = (a.x + b.x) / 2 - r.left, cy = (a.y + b.y) / 2 - r.top;
      const ns = Math.min(6, Math.max(1, base.s * (d / pinch0)));
      v.s = ns;
      v.x = cx - ((cx - base.x) / base.s) * ns;
      v.y = cy - ((cy - base.y) / base.s) * ns;
      if (v.s <= 1.02) { v.s = 1; v.x = 0; v.y = 0; }
      applyPlanView(id);
      moved = true;
    } else if (pointers.size === 1 && start) {
      if (Math.hypot(e.clientX - start.x, e.clientY - start.y) > 8) moved = true;
    }
  });
  function up(e) {
    const tap = pointers.size === 1 && start && !moved;
    pointers.delete(e.pointerId);
    if (tap && editable) dropOnPlan(id, e.clientX, e.clientY);
    if (!pointers.size) start = null;
    if (pointers.size < 2) { pinch0 = 0; base = null; }
  }
  view.addEventListener("pointerup", up);
  view.addEventListener("pointercancel", up);
}
function showPlans() {
  const el = document.getElementById("plans");
  if (!el) return;
  el.innerHTML = survey.plans.length ? survey.plans.map(pl => `<div class="card">
      <div class="row"><strong>${esc(pl.name)}</strong><button class="ghost" style="width:auto;padding:8px 12px" onclick="removePlan('${pl.id}')">Remove plan</button></div>
      <p><small>Pinch or use + to zoom, then tap to drop a ${label(intActive)}.</small></p>
      ${planFrame(pl)}
      ${pl.pins.map(p => pinCard(p, pl.id)).join("")}
    </div>`).join("") : `<p><small>No floor plan yet. Photograph the paper diagram and upload it.</small></p>`;
  survey.plans.forEach(pl => bindPlanGestures(pl.id, true));
}
function planPins(pl) {
  return pl.pins.map(p => `<span class="plan-pin" style="left:${p.x}%;top:${p.y}%" onclick="event.stopPropagation();openPin('${p.id}','${pl.id}')">${symbolSvg(p.type, 28)}</span>`).join("");
}
function removePlan(id) {
  survey.plans = survey.plans.filter(p => p.id !== id);
  save();
  showPlans();
}
function openPin(id, planId) {
  openDetail = id;
  const pin = findPin(id, planId);
  if (!pin) return;
  alert(label(pin.type) + (pin.note ? " — " + pin.note : " — no note yet"));
}

function bootMap() {
  const el = document.getElementById("map");
  if (!el) return;
  if (typeof L === "undefined") { setTimeout(bootMap, 80); return; }
  if (el.offsetHeight < 40) { setTimeout(bootMap, 40); return; }
  const c = survey.building.center;
  const start = c ? [c.lat, c.lng] : [39.28, -89.65];
  const zoom = c ? (c.zoom || 18) : 16;
  map = L.map(el, { zoomControl: true, maxZoom: 22, zoomSnap: 0.25 }).setView(start, zoom);
  L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", { attribution: "Tiles © Esri", maxZoom: 22, maxNativeZoom: 19 }).addTo(map);
  pinLayer = L.layerGroup().addTo(map);
  map.on("click", e => addPin(e.latlng.lat, e.latlng.lng));
  map.on("moveend", rememberView);
  const fix = () => { try { map.invalidateSize(); } catch (e) {} };
  setTimeout(fix, 60); setTimeout(fix, 300); setTimeout(fix, 800);
  if (window.ResizeObserver) new ResizeObserver(fix).observe(el.parentElement);
  drawPins();
  if (!c) flyAddress();
}
function rememberView() {
  if (!map) return;
  const v = map.getCenter();
  survey.building.center = { lat: v.lat, lng: v.lng, zoom: map.getZoom() };
  save();
}
function drawPins() {
  if (!pinLayer) return;
  pinLayer.clearLayers();
  survey.pins.forEach(p => {
    if (p.lat == null) return;
    L.marker([p.lat, p.lng], { icon: icon(p.type) }).addTo(pinLayer).bindPopup(popupHtml(p));
  });
}
function popupHtml(p) {
  return `<strong>${label(p.type)}</strong>${p.note ? "<br>" + esc(p.note) : "<br>No note"}` +
    (p.media && p.mediaType !== "video" ? `<br><img src="${p.media}" style="width:180px;border-radius:6px;margin-top:6px">` : "");
}
function flyAddress() {
  const q = (survey.building.address || "").trim();
  if (q.length < 4) return;
  fetch("https://geocode.arcgis.com/arcgis/rest/services/World/GeocodeServer/findAddressCandidates?f=json&maxLocations=1&SingleLine=" + encodeURIComponent(q))
    .then(r => r.json())
    .then(data => {
      const loc = data.candidates && data.candidates[0] && data.candidates[0].location;
      if (!loc || !map) return;
      survey.building.center = { lat: loc.y, lng: loc.x, zoom: 18 };
      save();
      if (buildingMarker) buildingMarker.remove();
      buildingMarker = L.marker([loc.y, loc.x], { icon: icon("other"), interactive: false }).addTo(map).bindPopup("Building");
      map.setView([loc.y, loc.x], 18);
      setTimeout(() => map && map.invalidateSize(), 100);
    })
    .catch(() => {});
}

function sheetHtml() {
  const b = survey.building;
  const missing = CRITICAL.filter(id => !survey.pins.some(p => p.type === id) && !survey.plans.some(pl => pl.pins.some(p => p.type === id)));
  const line = id => {
    const list = survey.pins.filter(p => p.type === id).concat(survey.plans.flatMap(pl => pl.pins.filter(p => p.type === id)));
    return `<p><strong>${label(id)}:</strong> ${list.length ? list.map(p => esc(p.note) || "Marked, no note").join("; ") : "Not marked"}</p>`;
  };
  return `<h1>Quick Action Sheet</h1>
    <p>${esc(b.name) || "Unnamed"} · ${esc(b.address) || "No address"}</p>
    ${missing.length ? `<div class="warn">Still missing: ${missing.map(label).join(", ")}</div>` : ""}
    <h2>Exterior</h2>
    <div class="sheet-map"><div id="sheet-map"></div></div>
    <div class="card"><strong>Occupancy</strong><p>${esc(b.occupancy)} · ${esc(b.stories) || "1"} story<br>Contact: ${esc(b.contactName || b.contact || "Not entered")}${b.contactPhone ? `<br><a href="tel:${esc(b.contactPhone)}" style="color:#e8a317">${esc(b.contactPhone)}</a>` : ""}</p></div>
    <div class="card"><strong>Hazards</strong><p style="color:#e23b3b">${esc(b.hazards) || "None noted"}</p></div>
    <div class="card"><strong>Hydrants</strong><p>${esc(b.hydrants) || "None noted"}</p>${line("hydrant")}</div>
    <div class="card"><strong>Fastest exterior access</strong>${line("gas")}${line("electric")}${line("knox")}${line("exits")}</div>
    <h2>Interior</h2>
    ${survey.plans.length ? survey.plans.map(pl => `<div class="card"><strong>${esc(pl.name)}</strong>
      ${planFrame(pl)}
      <div id="sheet-detail-${pl.id}"></div>
    </div>`).join("") : `<p><small>No interior diagram uploaded.</small></p>`}
    <div class="card"><strong>Interior notes</strong>${line("facp")}<p>${esc(b.notes)}</p></div>
    ${survey.pins.map(p => `<div class="card"><strong>${symbolSvg(p.type, 20)} ${label(p.type)}</strong> — ${esc(p.note) || "No note"}${p.lat != null ? `<br><small>${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}</small>` : ""}${p.media && p.mediaType !== "video" ? `<img class="shot" src="${p.media}" alt="">` : ""}</div>`).join("")}
    <div class="nav"><button class="ghost" onclick="go(3)">Back</button><button onclick="window.print()">Save PDF</button></div>`;
}
function bootSheet() {
  survey.plans.forEach(pl => bindPlanGestures(pl.id, false));
  survey.plans.forEach(pl => {
    const nodes = document.querySelectorAll("#view-" + pl.id + " .plan-pin");
    nodes.forEach((node, i) => {
      const p = pl.pins[i];
      if (!p) return;
      node.onclick = (e) => {
        e.stopPropagation();
        const box = document.getElementById("sheet-detail-" + pl.id);
        if (box) box.innerHTML = `<div class="detail"><strong>${label(p.type)}</strong><p>${esc(p.note) || "No note"}</p>${p.media && p.mediaType !== "video" ? `<img class="shot" src="${p.media}" alt="">` : ""}</div>`;
      };
    });
  });
  const el = document.getElementById("sheet-map");
  if (!el || typeof L === "undefined") return;
  const located = survey.pins.filter(p => p.lat != null);
  const c = survey.building.center;
  const start = located.length ? [located[0].lat, located[0].lng] : (c ? [c.lat, c.lng] : [39.28, -89.65]);
  const m = L.map(el, { zoomControl: true, maxZoom: 22, zoomSnap: 0.25 }).setView(start, 18);
  sheetMaps.push(m);
  L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", { attribution: "Tiles © Esri", maxZoom: 22, maxNativeZoom: 19 }).addTo(m);
  const group = [];
  survey.pins.forEach(p => {
    if (p.lat == null) return;
    const mk = L.marker([p.lat, p.lng], { icon: icon(p.type) }).addTo(m).bindPopup(popupHtml(p));
    group.push(mk);
  });
  if (group.length > 1) m.fitBounds(L.featureGroup(group).getBounds().pad(0.25), { maxZoom: 19 });
  else if (group.length === 1) m.setView(group[0].getLatLng(), 19);
  const fix = () => { try { m.invalidateSize(); } catch (e) {} };
  setTimeout(fix, 80); setTimeout(fix, 400);
}
render();
</script>
</body>
</html>
