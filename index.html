<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Pre-Plan Walkthrough</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #0e1114; color: #f3f5f7; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .wrap { max-width: 540px; margin: 0 auto; padding: 16px 16px 48px; }
  h1 { font-size: 1.7rem; margin: 0 0 6px; letter-spacing: 0.02em; text-transform: uppercase; }
  p { color: #9aa3ad; }
  button { width: 100%; background: #e8a317; color: #1a1406; border: 0; border-radius: 12px; padding: 14px; font-size: 1rem; font-weight: 700; margin: 6px 0; }
  button.ghost { background: #212830; color: #f3f5f7; }
  button.on { outline: 2px solid #f3f5f7; }
  input, select, textarea { width: 100%; margin: 4px 0 12px; padding: 12px; border-radius: 12px; border: 1px solid #2c353e; background: #0e1114; color: #f3f5f7; font-size: 1rem; }
  label { color: #9aa3ad; font-size: 0.9rem; }
  .card { background: #171c21; border: 1px solid #2c353e; border-radius: 14px; padding: 14px; margin: 12px 0; }
  .nav { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
  .chips button { width: auto; flex: 0 0 auto; border-radius: 999px; padding: 8px 14px; }
  #map-wrap { height: 380px; width: 100%; border: 2px solid #e8a317; border-radius: 14px; overflow: hidden; background: #171c21; }
  #map { height: 100%; width: 100%; }
  .leaflet-container { height: 100% !important; width: 100% !important; background: #171c21; font: inherit; }
  .leaflet-container img { max-width: none !important; max-height: none !important; }
  .pin-dot { width: 16px; height: 16px; border-radius: 99px; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.6); }
  .bar { height: 4px; background: #212830; border-radius: 4px; margin: 10px 0 16px; }
  .bar > div { height: 100%; background: #e8a317; width: 0; }
  .warn { border: 1px solid #e23b3b; color: #e23b3b; border-radius: 12px; padding: 12px; }
  .shot { width: 100%; border-radius: 10px; margin-top: 8px; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  small { color: #9aa3ad; }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar"><div id="bar"></div></div>
  <div id="app"></div>
</div>
<script>
const TYPES = [
  { id: "gas", label: "Gas", color: "#e8a317" },
  { id: "electric", label: "Electric", color: "#f97316" },
  { id: "hydrant", label: "Hydrant", color: "#3d8bfd" },
  { id: "knox", label: "Knox", color: "#f3f5f7" },
  { id: "exits", label: "Exit", color: "#3dbe7a" },
  { id: "facp", label: "FACP", color: "#e23b3b" },
  { id: "other", label: "Other", color: "#9aa3ad" }
];
const CRITICAL = ["gas", "electric", "knox", "exits", "facp"];
const STEPS = ["start", "building", "exterior", "interior", "plan"];
const KEY = "fd-preplan-pages-v1";
let step = 0;
let active = "gas";
let survey = load();
let map, pinLayer, buildingMarker;

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) throw new Error("empty");
    const data = JSON.parse(raw);
    if (!data.building || !Array.isArray(data.pins)) throw new Error("bad");
    return data;
  } catch (e) {
    return { building: { name: "", address: "", occupancy: "Educational (Group E)", stories: "1", contact: "", hazards: "", hydrants: "", notes: "" }, pins: [] };
  }
}
function save() { localStorage.setItem(KEY, JSON.stringify(survey)); }
function label(id) { return (TYPES.find(t => t.id === id) || {}).label || id; }
function color(id) { return (TYPES.find(t => t.id === id) || {}).color || "#9aa3ad"; }
function uid() { return Math.random().toString(36).slice(2, 10); }
function esc(s) {
  return String(s || "").replace(/[&<>"']/g, function (c) {
    if (c === "&") return "&" + "amp;";
    if (c === "<") return "&" + "lt;";
    if (c === ">") return "&" + "gt;";
    if (c === '"') return "&" + "quot;";
    return "&" + "#39;";
  });
}

function render() {
  if (map) { try { map.remove(); } catch (e) {} map = null; pinLayer = null; buildingMarker = null; }
  document.getElementById("bar").style.width = (step / (STEPS.length - 1) * 100) + "%";
  const app = document.getElementById("app");
  const s = STEPS[step];
  const b = survey.building;
  if (s === "start") {
    app.innerHTML = `<h1>Pre-Plan</h1><p>Satellite overhead. Tap to mark gas, electric, hydrants, Knox, and exits. Finish with a Quick Action Plan.</p>
      <button onclick="fresh()">Start new walkthrough</button>
      ${b.name ? `<button class="ghost" onclick="go(2)">Continue ${esc(b.name)}</button>` : ""}`;
  } else if (s === "building") {
    app.innerHTML = `<h1>Building</h1>
      <label>Name</label><input id="name" value="${esc(b.name)}" placeholder="Mt Clare School">
      <label>Address</label><input id="address" value="${esc(b.address)}" placeholder="1022 N High St, Carlinville IL">
      <label>Occupancy</label><select id="occ"><option>Educational (Group E)</option><option>Mercantile</option><option>Business</option><option>Assembly</option><option>Residential</option><option>Industrial</option><option>Other</option></select>
      <label>Stories</label><input id="stories" value="${esc(b.stories || "1")}">
      <label>Contact</label><input id="contact" value="${esc(b.contact)}" placeholder="Name and phone">
      <label>Hazards</label><textarea id="hazards" rows="2">${esc(b.hazards)}</textarea>
      <label>Hydrant notes</label><textarea id="hydrants" rows="2">${esc(b.hydrants)}</textarea>
      <label>Notes</label><textarea id="notes" rows="2">${esc(b.notes)}</textarea>
      <div class="nav"><button class="ghost" onclick="go(0)">Back</button><button onclick="saveBuilding()">Exterior map</button></div>`;
    document.getElementById("occ").value = b.occupancy || "Educational (Group E)";
  } else if (s === "exterior") {
    app.innerHTML = `<h1>Exterior</h1>
      <p>Pick the item, then tap the satellite photo. Write the side of the building so crews do not come in the wrong way.</p>
      <div class="chips">${TYPES.filter(t => t.id !== "facp").map(t => `<button class="${active === t.id ? "on" : "ghost"}" onclick="setType('${t.id}')">${t.label}</button>`).join("")}</div>
      <div id="map-wrap"><div id="map"></div></div>
      <p><small>Tap the photo to drop a <span id="active-label">${label(active)}</span> marker.</small></p>
      <button class="ghost" onclick="dropGps()">Drop ${label(active)} at my GPS</button>
      <div id="pins"></div>
      <div class="nav"><button class="ghost" onclick="go(1)">Back</button><button onclick="go(3)">Interior</button></div>`;
    showPins();
    setTimeout(bootMap, 30);
  } else if (s === "interior") {
    const missing = CRITICAL.filter(id => !survey.pins.some(p => p.type === id));
    app.innerHTML = `<h1>Interior</h1><p>Stand at the panel or the door. Mark it, note the room and wall, take the photo.</p>
      <button onclick="dropGps('facp')">Mark FACP here</button>
      <button class="ghost" onclick="dropGps('exits')">Mark exit here</button>
      <div id="pins"></div>
      ${missing.length ? `<div class="warn" id="gap">Still needed before you sign off: ${missing.map(label).join(", ")}</div>` : `<p>Critical items are marked.</p>`}
      <div class="nav"><button class="ghost" onclick="go(2)">Back</button><button onclick="finish()">Quick Action Plan</button></div>`;
    showPins();
  } else {
    app.innerHTML = planHtml();
  }
}

function fresh() { survey = load(); survey = { building: { name: "", address: "", occupancy: "Educational (Group E)", stories: "1", contact: "", hazards: "", hydrants: "", notes: "" }, pins: [] }; save(); go(1); }
function go(n) { step = n; save(); render(); }
function setType(id) { active = id; render(); }
function saveBuilding() {
  const b = survey.building;
  b.name = document.getElementById("name").value;
  b.address = document.getElementById("address").value;
  b.occupancy = document.getElementById("occ").value;
  b.stories = document.getElementById("stories").value;
  b.contact = document.getElementById("contact").value;
  b.hazards = document.getElementById("hazards").value;
  b.hydrants = document.getElementById("hydrants").value;
  b.notes = document.getElementById("notes").value;
  save(); go(2);
}
function finish() {
  const missing = CRITICAL.filter(id => !survey.pins.some(p => p.type === id));
  if (missing.length && !confirm("Missing: " + missing.map(label).join(", ") + ". Open the plan anyway?")) return;
  go(4);
}

function addPin(lat, lng, type) {
  survey.pins.push({ id: uid(), type: type || active, note: "", lat, lng });
  save();
  if (STEPS[step] === "exterior" && map && lat != null) drawPins();
  showPins();
}
function patch(id, note) {
  const pin = survey.pins.find(p => p.id === id);
  if (pin) pin.note = note;
  save();
}
function removePin(id) {
  survey.pins = survey.pins.filter(p => p.id !== id);
  save();
  if (map) drawPins();
  showPins();
}
function photo(id, input) {
  const file = input.files && input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const pin = survey.pins.find(p => p.id === id);
    if (!pin) return;
    pin.media = reader.result;
    pin.mediaType = file.type.indexOf("video") === 0 ? "video" : "image";
    save();
    showPins();
  };
  reader.readAsDataURL(file);
}
function dropGps(type) {
  if (!navigator.geolocation) { alert("GPS is not available on this device."); return; }
  navigator.geolocation.getCurrentPosition(
    pos => addPin(pos.coords.latitude, pos.coords.longitude, type || active),
    () => alert("Location was denied. You can still tap the satellite photo."),
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

function showPins() {
  const el = document.getElementById("pins");
  if (!el) return;
  const list = STEPS[step] === "interior"
    ? survey.pins.filter(p => p.type === "facp" || p.type === "exits" || p.type === "other")
    : survey.pins.filter(p => p.type !== "facp");
  el.innerHTML = list.length ? list.map(p => `<div class="card">
      <div class="row"><strong><span class="pin-dot" style="display:inline-block;background:${color(p.type)};vertical-align:middle"></span> ${label(p.type)}</strong>
      <button class="ghost" style="width:auto;padding:8px 12px" onclick="removePin('${p.id}')">Remove</button></div>
      ${p.lat != null ? `<small>${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}</small>` : ""}
      <input value="${esc(p.note)}" placeholder="Side of building, room, access" oninput="patch('${p.id}', this.value)">
      <label class="ghost" style="display:block;text-align:center;background:#212830;border-radius:10px;padding:10px;font-weight:700">Add photo
        <input type="file" accept="image/*,video/*" capture="environment" style="display:none" onchange="photo('${p.id}', this)">
      </label>
      ${p.media && p.mediaType !== "video" ? `<img class="shot" src="${p.media}" alt="">` : ""}
      ${p.media && p.mediaType === "video" ? `<video class="shot" src="${p.media}" controls></video>` : ""}
    </div>`).join("") : `<p><small>No markers yet.</small></p>`;
}

function icon(c) {
  return L.divIcon({ className: "", html: `<div class="pin-dot" style="background:${c}"></div>`, iconSize: [16, 16], iconAnchor: [8, 8] });
}
function bootMap() {
  const el = document.getElementById("map");
  if (!el) return;
  if (typeof L === "undefined") { setTimeout(bootMap, 80); return; }
  if (el.offsetHeight < 40) { setTimeout(bootMap, 40); return; }
  map = L.map(el, { zoomControl: true }).setView([39.28, -89.65], 16);
  L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", { attribution: "Tiles © Esri", maxZoom: 19 }).addTo(map);
  pinLayer = L.layerGroup().addTo(map);
  map.on("click", e => addPin(e.latlng.lat, e.latlng.lng));
  const fix = () => { try { map.invalidateSize(); } catch (e) {} };
  setTimeout(fix, 60); setTimeout(fix, 300); setTimeout(fix, 800);
  if (window.ResizeObserver) new ResizeObserver(fix).observe(el.parentElement);
  drawPins();
  flyAddress();
}
function drawPins() {
  if (!pinLayer) return;
  pinLayer.clearLayers();
  survey.pins.forEach(p => {
    if (p.lat == null) return;
    L.marker([p.lat, p.lng], { icon: icon(color(p.type)) }).addTo(pinLayer).bindPopup(label(p.type) + (p.note ? " — " + p.note : ""));
  });
}
function flyAddress() {
  const q = (survey.building.address || "").trim();
  if (q.length < 4) return;
  fetch("https://geocode.arcgis.com/arcgis/rest/services/World/GeocodeServer/findAddressCandidates?f=json&maxLocations=1&SingleLine=" + encodeURIComponent(q))
    .then(r => r.json())
    .then(data => {
      const loc = data.candidates && data.candidates[0] && data.candidates[0].location;
      if (!loc || !map) return;
      if (buildingMarker) buildingMarker.remove();
      buildingMarker = L.marker([loc.y, loc.x], { icon: icon("#f3f5f7"), interactive: false }).addTo(map).bindPopup("Building");
      map.setView([loc.y, loc.x], 18);
      setTimeout(() => map && map.invalidateSize(), 100);
    })
    .catch(() => {});
}

function planHtml() {
  const b = survey.building;
  const located = survey.pins.filter(p => p.lat != null);
  const missing = CRITICAL.filter(id => !survey.pins.some(p => p.type === id));
  let img = "";
  if (located.length) {
    const lats = located.map(p => p.lat), lngs = located.map(p => p.lng);
    const pad = 0.0018;
    const south = Math.min.apply(null, lats) - pad, north = Math.max.apply(null, lats) + pad;
    const west = Math.min.apply(null, lngs) - pad, east = Math.max.apply(null, lngs) + pad;
    const src = `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/export?bbox=${west},${south},${east},${north}&bboxSR=4326&size=800,520&format=png&f=image`;
    const dots = located.map(p => {
      const x = (p.lng - west) / (east - west) * 100;
      const y = (1 - (p.lat - south) / (north - south)) * 100;
      return `<span style="position:absolute;left:${x}%;top:${y}%;width:12px;height:12px;border-radius:99px;border:2px solid #fff;background:${color(p.type)};transform:translate(-50%,-50%)"></span>`;
    }).join("");
    img = `<div style="position:relative;margin:12px 0;border-radius:14px;overflow:hidden;border:1px solid #2c353e"><img src="${src}" alt="Overhead" style="width:100%;display:block">${dots}</div>`;
  }
  const line = id => {
    const list = survey.pins.filter(p => p.type === id);
    return `<p><strong>${label(id)}:</strong> ${list.length ? list.map(p => esc(p.note) || "Marked, no side noted").join("; ") : "Not marked"}</p>`;
  };
  return `<h1>Quick Action Plan</h1>
    <p>${esc(b.name) || "Unnamed"} · ${esc(b.address) || "No address"}</p>
    ${missing.length ? `<div class="warn">Still missing: ${missing.map(label).join(", ")}</div>` : ""}
    ${img}
    <div class="card"><strong>Occupancy</strong><p>${esc(b.occupancy)} · ${esc(b.stories) || "1"} story<br>Contact: ${esc(b.contact) || "Not entered"}</p></div>
    <div class="card"><strong>Hazards</strong><p style="color:#e23b3b">${esc(b.hazards) || "None noted"}</p></div>
    <div class="card"><strong>Hydrants</strong><p>${esc(b.hydrants) || "None noted"}</p>${line("hydrant")}</div>
    <div class="card"><strong>Fastest exterior access</strong>${line("gas")}${line("electric")}${line("knox")}${line("exits")}</div>
    <div class="card"><strong>Interior</strong>${line("facp")}<p>${esc(b.notes)}</p></div>
    ${survey.pins.map(p => `<div class="card"><strong>${label(p.type)}</strong> — ${esc(p.note) || "No note"}${p.lat != null ? `<br><small>${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}</small>` : ""}${p.media && p.mediaType !== "video" ? `<img class="shot" src="${p.media}" alt="">` : ""}</div>`).join("")}
    <div class="nav"><button class="ghost" onclick="go(3)">Back</button><button onclick="window.print()">Save PDF</button></div>
    <p><small>On iPhone, Save PDF opens the share sheet. Choose Save to Files.</small></p>`;
}
render();
</script>
</body>
</html>
