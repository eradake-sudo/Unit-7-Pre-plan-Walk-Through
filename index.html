<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pre-Plan Walkthrough</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f1419;
    color: #e7e9ea;
    line-height: 1.45;
  }
  .wrap { max-width: 540px; margin: 0 auto; padding: 16px 16px 80px; }
  h1 { font-size: 1.5rem; margin: 0 0 6px; font-weight: 700; }
  h2 { font-size: 1.15rem; margin: 18px 0 8px; color: #1d9bf0; }
  p { margin: 6px 0 12px; color: #c9cdd1; }
  .card {
    background: #1a1d21;
    border: 1px solid #2f3336;
    border-radius: 14px;
    padding: 16px;
    margin: 12px 0;
  }
  button {
    width: 100%;
    background: #1d9bf0;
    color: #fff;
    border: none;
    padding: 14px;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 600;
    margin: 6px 0;
    cursor: pointer;
  }
  button.secondary { background: #2f3336; }
  button.danger { background: #f4212e; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  input, select, textarea {
    width: 100%;
    padding: 12px;
    margin: 4px 0 12px;
    border-radius: 10px;
    border: 1px solid #2f3336;
    background: #0f1419;
    color: #e7e9ea;
    font-size: 1rem;
  }
  label { font-size: 0.9rem; color: #8b949e; display: block; margin-top: 8px; }
  .progress { height: 4px; background: #2f3336; border-radius: 2px; margin: 12px 0 16px; }
  .progress-bar { height: 100%; background: #1d9bf0; border-radius: 2px; transition: width .25s; }
  #map { height: 360px; border-radius: 14px; margin: 12px 0; background: #1a1d21; border: 1px solid #2f3336; }
  .critical { color: #f4212e; font-weight: 600; }
  .ok { color: #00ba7c; }
  .nav { display: flex; gap: 8px; margin-top: 16px; }
  .nav button { flex: 1; }
  .pin { padding: 10px 0; border-bottom: 1px solid #2f3336; font-size: 0.92rem; }
  .coords { font-family: ui-monospace, monospace; font-size: 0.8rem; color: #8b949e; }
  small { color: #8b949e; }
  .warning { background: #3d1f1f; border: 1px solid #f4212e; color: #ff8a8a; padding: 12px; border-radius: 10px; margin: 12px 0; }
  .success { background: #1a3a1a; border: 1px solid #00ba7c; color: #7ee0b0; padding: 12px; border-radius: 10px; margin: 12px 0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="progress"><div class="progress-bar" id="bar"></div></div>
  <div id="app"></div>
</div>

<script>
const CRITICAL = [
  { id: 'gas', label: 'Gas shutoff', tip: 'Exterior near meter. Note the side of the building and fastest approach.' },
  { id: 'electric', label: 'Main electrical disconnect', tip: 'Usually outside by the meter or in the main electrical room.' },
  { id: 'knox', label: 'Knox box', tip: 'Near main entrance. Note side and height.' },
  { id: 'exits', label: 'Exits / entrances', tip: 'Every exterior door. Note swing and if locked.' },
  { id: 'facp', label: 'Fire alarm panel (FACP)', tip: 'Often near main entrance, office, or mechanical room.' }
];

const STEPS = ['welcome', 'building', 'exterior', 'interior', 'review'];
let step = 0;
let survey = JSON.parse(localStorage.getItem('preplan') || 'null') || {
  id: Date.now(), building: {}, pins: [], completed: {}
};

function save() {
  localStorage.setItem('preplan', JSON.stringify(survey));
}

function progress() {
  document.getElementById('bar').style.width = Math.round((step / (STEPS.length - 1)) * 100) + '%';
}

function render() {
  progress();
  const app = document.getElementById('app');
  const s = STEPS[step];

  if (s === 'welcome') {
    app.innerHTML = `
      <h1>Pre-Plan Walkthrough</h1>
      <p>Guided survey for first-due info. Mark utilities, hydrants, exits, and the alarm panel with GPS and photos. Finish with a Quick Action Plan you can pull up on scene.</p>
      <div class="card">
        <strong>Steps</strong>
        <ol style="margin:8px 0 0 18px; padding:0;">
          <li>Building basics, contacts, hazards</li>
          <li>Exterior satellite map — tap to drop markers</li>
          <li>Interior — FACP and exits</li>
          <li>Review and generate Quick Action Plan</li>
        </ol>
      </div>
      <button onclick="step=1; render()">Start New Walkthrough</button>
      <button class="secondary" onclick="step=4; render()">Jump to Review</button>
    `;
  }

  else if (s === 'building') {
    const b = survey.building;
    app.innerHTML = `
      <h1>Building Basics</h1>
      <p>Enter what you know. You can update later.</p>
      <label>Name / Occupancy</label>
      <input id="name" value="${b.name || ''}" placeholder="Mt Clare School">
      <label>Address</label>
      <input id="address" value="${b.address || ''}" placeholder="Street, city">
      <label>Occupancy Type</label>
      <select id="occ">
        <option>Educational (Group E)</option>
        <option>Mercantile</option>
        <option>Business</option>
        <option>Assembly</option>
        <option>Other</option>
      </select>
      <label>Stories</label>
      <input id="stories" type="number" value="${b.stories || 1}" min="1">
      <label>Primary Contact</label>
      <input id="contact" value="${b.contact || ''}" placeholder="Name and phone">
      <label>Known Hazards</label>
      <textarea id="hazards" rows="2" placeholder="Fireworks, oxygen, chemicals, etc.">${b.hazards || ''}</textarea>
      <label>Nearest Hydrants</label>
      <textarea id="hydrants" rows="2" placeholder="Location and distance">${b.hydrants || ''}</textarea>
      <label>Notes</label>
      <textarea id="notes" rows="2">${b.notes || ''}</textarea>
      <div class="nav">
        <button class="secondary" onclick="step--; render()">Back</button>
        <button onclick="saveBuilding()">Next: Exterior Map</button>
      </div>
    `;
    document.getElementById('occ').value = b.occupancy || 'Educational (Group E)';
  }

  else if (s === 'exterior') {
    app.innerHTML = `
      <h1>Exterior Map</h1>
      <p>Satellite view of the address. Tap the map to drop a marker, or use the buttons below. Note the side of the building for fastest access.</p>
      <div id="map"></div>
      <button onclick="centerMe()">My Location</button>
      <div class="card">
        <h2>Mark Locations</h2>
        <button onclick="mark('gas')">Gas Shutoff</button>
        <button onclick="mark('electric')">Electric Main</button>
        <button onclick="mark('hydrant')">Hydrant</button>
        <button onclick="mark('knox')">Knox Box</button>
        <button onclick="mark('exits')">Exit / Entrance</button>
        <button class="secondary" onclick="mark('other')">Other</button>
      </div>
      <div id="pins"></div>
      <div class="nav">
        <button class="secondary" onclick="step--; render()">Back</button>
        <button onclick="step++; render()">Next: Interior</button>
      </div>
    `;
    setTimeout(initMap, 50);
    showPins();
  }

  else if (s === 'interior') {
    app.innerHTML = `
      <h1>Interior</h1>
      <p>Mark the fire alarm panel and exits. Add a photo of each.</p>
      <div class="card">
        <button onclick="mark('facp')">Mark FACP</button>
        <button onclick="mark('exits')">Mark Exit</button>
        <button class="secondary" onclick="mark('other')">Other Interior</button>
      </div>
      <div id="pins"></div>
      <div class="nav">
        <button class="secondary" onclick="step--; render()">Back</button>
        <button onclick="step++; render()">Review</button>
      </div>
    `;
    showPins();
  }

  else if (s === 'review') {
    const missing = CRITICAL.filter(c => !survey.completed[c.id]);
    app.innerHTML = `
      <h1>Review</h1>
      ${missing.length
        ? `<div class="warning"><strong>Still needed:</strong><ul>${missing.map(m => `<li>${m.label}</li>`).join('')}</ul></div>`
        : '<div class="success">All critical items marked.</div>'}
      <div class="card">
        <strong>${survey.building.name || 'Unnamed'}</strong><br>
        ${survey.building.address || ''}<br>
        <small>${survey.building.occupancy || ''} • ${survey.building.stories || 1} story</small>
      </div>
      <div id="pins"></div>
      <button onclick="generatePlan()">View Quick Action Plan</button>
      <button class="secondary" onclick="step=0; render()">Start Over</button>
    `;
    showPins();
  }
}

function saveBuilding() {
  const b = survey.building;
  b.name = document.getElementById('name').value;
  b.address = document.getElementById('address').value;
  b.occupancy = document.getElementById('occ').value;
  b.stories = document.getElementById('stories').value;
  b.contact = document.getElementById('contact').value;
  b.hazards = document.getElementById('hazards').value;
  b.hydrants = document.getElementById('hydrants').value;
  b.notes = document.getElementById('notes').value;
  save();
  step++;
  render();
}

function getLoc(cb) {
  if (!navigator.geolocation) return cb(null, null);
  navigator.geolocation.getCurrentPosition(
    p => cb(p.coords.latitude, p.coords.longitude),
    () => cb(null, null),
    { enableHighAccuracy: true, timeout: 8000 }
  );
}

function mark(type) {
  const note = prompt('Note (side of building, room, description):') || '';
  getLoc((lat, lng) => {
    const pin = { type, note, lat, lng, time: new Date().toISOString() };
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*,video/*';
    input.capture = 'environment';
    input.onchange = e => {
      const file = e.target.files[0];
      if (file) {
        const r = new FileReader();
        r.onload = () => {
          pin.media = r.result;
          pin.mediaType = file.type.startsWith('video') ? 'video' : 'image';
          finish(pin);
        };
        r.readAsDataURL(file);
      } else finish(pin);
    };
    input.click();
    setTimeout(() => { if (!pin.media) finish(pin); }, 8000);
  });
  function finish(p) {
    survey.pins.push(p);
    survey.completed[type] = true;
    save();
    if (window.map && p.lat) L.marker([p.lat, p.lng]).addTo(window.map).bindPopup(type + ': ' + note);
    showPins();
  }
}

function showPins() {
  const el = document.getElementById('pins');
  if (!el) return;
  el.innerHTML = survey.pins.length
    ? survey.pins.map(p => `
        <div class="pin">
          <strong>${p.type.toUpperCase()}</strong> — ${p.note || 'No note'}<br>
          ${p.lat ? `<span class="coords">${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}</span>` : ''}
          ${p.media ? (p.mediaType === 'video' ? `<video src="${p.media}" controls style="max-width:100%;margin-top:6px;"></video>` : `<img src="${p.media}" style="max-width:100%;margin-top:6px;border-radius:8px;">`) : ''}
        </div>`).join('')
    : '<p><small>No markers yet.</small></p>';
}

function initMap() {
  const el = document.getElementById('map');
  if (!el || typeof L === 'undefined') return;
  if (window.map) { try { window.map.remove(); } catch(e){} }
  const map = L.map(el).setView([39.13, -89.82], 16);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Esri', maxZoom: 19
  }).addTo(map);
  window.map = map;

  const addr = (survey.building.address || '') + ' ' + (survey.building.name || '');
  if (addr.trim()) {
    fetch('https://nominatim.openstreetmap.org/search?format=json&q=' + encodeURIComponent(addr) + '&limit=1')
      .then(r => r.json())
      .then(d => {
        if (d && d[0]) {
          const lat = +d[0].lat, lon = +d[0].lon;
          map.setView([lat, lon], 18);
          L.marker([lat, lon]).addTo(map).bindPopup('Building').openPopup();
        }
      }).catch(() => {});
  }

  map.on('click', e => {
    const type = prompt('Type (gas, electric, hydrant, exits, knox, other):', 'gas') || 'other';
    const note = prompt('Note:') || '';
    const pin = { type: type.toLowerCase(), note, lat: e.latlng.lat, lng: e.latlng.lng, time: new Date().toISOString() };
    survey.pins.push(pin);
    survey.completed[pin.type] = true;
    save();
    L.marker(e.latlng).addTo(map).bindPopup(type + ': ' + note);
    showPins();
  });

  survey.pins.filter(p => p.lat).forEach(p => {
    L.marker([p.lat, p.lng]).addTo(map).bindPopup(p.type + ': ' + (p.note || ''));
  });

  setTimeout(() => map.invalidateSize(), 200);
  setTimeout(() => map.invalidateSize(), 600);
}

function centerMe() {
  getLoc((lat, lng) => {
    if (window.map && lat) window.map.setView([lat, lng], 18);
  });
}

function generatePlan() {
  const b = survey.building;
  const pins = survey.pins;
  const by = t => pins.filter(p => p.type === t).map(p => p.note || 'Marked').join('; ') || 'Not marked';
  const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quick Action Plan</title>
  <style>body{font-family:-apple-system,sans-serif;margin:16px;color:#111}h1{font-size:1.5rem}h2{border-bottom:2px solid #1d9bf0;padding-bottom:4px;margin-top:18px}.box{border:1px solid #ddd;border-radius:8px;padding:12px;margin:10px 0}.c{color:#c00;font-weight:600}img{max-width:100%;border-radius:6px;margin:6px 0}@media print{button{display:none}}</style></head><body>
  <h1>Quick Action Plan</h1>
  <p><strong>${b.name || 'Building'}</strong><br>${b.address || ''}<br>${b.occupancy || ''} • ${b.stories || 1} story</p>
  <div class="box"><h2>Contact</h2><p>${b.contact || 'None entered'}</p></div>
  <div class="box"><h2>Hazards</h2><p class="c">${b.hazards || 'None noted'}</p></div>
  <div class="box"><h2>Hydrants</h2><p>${b.hydrants || 'None noted'}</p></div>
  <div class="box"><h2>Utilities & Access</h2>
    <p><strong>Gas:</strong> ${by('gas')}</p>
    <p><strong>Electric:</strong> ${by('electric')}</p>
    <p><strong>Knox:</strong> ${by('knox')}</p>
  </div>
  <div class="box"><h2>Exits / Entrances</h2><p>${by('exits')}</p></div>
  <div class="box"><h2>FACP</h2><p>${by('facp')}</p></div>
  <div class="box"><h2>All Markers</h2>${pins.map(p => `<p><strong>${p.type.toUpperCase()}</strong>: ${p.note || ''} ${p.lat ? '(' + p.lat.toFixed(5) + ', ' + p.lng.toFixed(5) + ')' : ''}${p.media && p.mediaType !== 'video' ? '<br><img src="' + p.media + '">' : ''}</p>`).join('') || 'None'}</div>
  <p style="font-size:0.8rem;color:#666;margin-top:20px">Generated ${new Date().toLocaleString()}</p>
  <button onclick="window.print()" style="padding:12px 20px;background:#1d9bf0;color:#fff;border:none;border-radius:8px;font-size:1rem;">Save as PDF</button>
  </body></html>`;
  const w = window.open('', '_blank');
  if (w) { w.document.write(html); w.document.close(); }
  else alert('Allow pop-ups to view the plan.');
}

render();
</script>
</body>
</html>
